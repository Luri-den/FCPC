<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Franklin County Pioneer Cemeteries Archive</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    >

    <script
        src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         PAGE STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            display: flex;
            flex-direction: column;

            background: #f4f1e8;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {

            background: #3f3528;

            color: white;

            padding: 14px 18px;

            z-index: 10;
        }


        header h1 {

            margin: 0 0 5px 0;

            font-size: 22px;
        }


        header p {

            margin: 0;

            font-size: 14px;

            opacity: 0.9;
        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        #controls {

            background: #eee9dc;

            border-bottom:
                1px solid #c9c1b2;

            padding: 10px;

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            align-items: center;

            z-index: 5;
        }


        #search {

            flex: 1 1 220px;

            min-width: 180px;

            padding: 9px 10px;

            border:
                1px solid #aaa;

            border-radius: 4px;

            font-size: 15px;
        }


        #year-filter {

            width: 150px;

            padding: 9px 10px;

            border:
                1px solid #aaa;

            border-radius: 4px;

            font-size: 15px;

            background: white;
        }


        button {

            padding: 9px 14px;

            border:
                1px solid #8d8375;

            border-radius: 4px;

            background: #5a4b3a;

            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        button:hover {

            background: #463a2d;
        }


        /* =====================================================
           MAP
           ===================================================== */

        #map {

            flex: 1;

            min-height: 0;

            width: 100%;

            position: relative;
        }


        /* =====================================================
           INFORMATION PANEL
           ===================================================== */

        #info-panel {

            position: absolute;

            top: 10px;
            right: 10px;

            width: 310px;

            max-width:
                calc(100% - 20px);

            max-height:
                calc(100% - 20px);

            overflow-y: auto;

            background:
                rgba(255, 255, 255, 0.96);

            border:
                1px solid #aaa;

            border-radius: 5px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.25);

            padding: 14px;

            z-index: 4;
        }


        #info-panel h2 {

            margin:
                0 0 6px 0;

            font-size: 20px;

            color: #3f3528;
        }


        #info-panel h3 {

            margin:
                12px 0 3px 0;

            font-size: 13px;

            color: #6b6258;

            text-transform:
                uppercase;
        }


        #info-panel p {

            margin: 0;

            line-height: 1.4;

            font-size: 14px;
        }


        .placeholder {

            color: #666;

            font-size: 14px;

            line-height: 1.4;
        }


        .error-message {

            color: #8b0000;

            font-size: 14px;

            line-height: 1.4;
        }


        /* =====================================================
           POPUP
           ===================================================== */

        .popup-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;

            color: #3f3528;
        }


        .popup-subtitle {

            font-size: 13px;

            color: #666;

            margin-bottom: 8px;
        }


        .popup-label {

            font-weight: bold;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            header {

                padding:
                    11px 13px;
            }


            header h1 {

                font-size: 18px;
            }


            header p {

                font-size: 12px;
            }


            #controls {

                padding: 8px;
            }


            #search,
            #year-filter,
            button {

                width: 100%;

                flex:
                    1 1 100%;
            }


            #info-panel {

                position: absolute;

                top: auto;

                right: 8px;
                bottom: 8px;
                left: 8px;

                width: auto;

                max-width: none;

                max-height: 38%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header>

        <h1>
            Franklin County Pioneer Cemeteries Archive
        </h1>

        <p>
            Historic cemetery locations and associated records
        </p>

    </header>


    <!-- =========================================================
         CONTROLS
         ========================================================= -->

    <div id="controls">

        <input
            type="text"
            id="search"
            placeholder="Search cemetery name or other name..."
        >

        <input
            type="number"
            id="year-filter"
            placeholder="Birth year..."
        >

        <button id="reset-button">
            Reset
        </button>

    </div>


    <!-- =========================================================
         MAP
         ========================================================= -->

    <div id="map">

        <div id="info-panel">

            <div class="placeholder">

                Click a cemetery marker to view
                its information.

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        // ========================================================
        // FILE LOCATION
        // ========================================================

        const GEOJSON_FILE =
            new URL(
                "graves.geojson",
                document.baseURI
            ).href;


        // ========================================================
        // MAP SETTINGS
        // ========================================================

        const MAP_CENTER = [
            -85.0626,
            39.3992
        ];


        const MAP_BOUNDS = [

            [
                -85.313644,
                39.263095
            ],

            [
                -84.811707,
                39.535292
            ]

        ];


        // ========================================================
        // CREATE MAP
        // ========================================================

        const map = new maplibregl.Map({

            container: "map",

            style: {

                version: 8,

                sources: {

                    osm: {

                        type: "raster",

                        tiles: [

                            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

                        ],

                        tileSize: 256,

                        attribution:
                            "© OpenStreetMap contributors"

                    }

                },

                layers: [

                    {

                        id: "osm",

                        type: "raster",

                        source: "osm"

                    }

                ]

            },

            center:
                MAP_CENTER,

            zoom: 10,

            maxBounds:
                MAP_BOUNDS

        });


        // ========================================================
        // NAVIGATION
        // ========================================================

        map.addControl(
            new maplibregl.NavigationControl(),
            "top-left"
        );


        // ========================================================
        // HTML ESCAPING
        // ========================================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ========================================================
        // SHOW CEMETERY INFORMATION
        // ========================================================

        function showCemeteryInfo(properties) {

            const name =
                escapeHTML(
                    properties.Cemetery_Name
                );


            const otherNames =
                escapeHTML(
                    properties.Other_Names
                );


            const township =
                escapeHTML(
                    properties.Township
                );


            const birthYear =
                escapeHTML(
                    properties.Birth_Year
                );


            const rowNumber =
                escapeHTML(
                    properties.Row_Number
                );


            const condition =
                escapeHTML(
                    properties.Condition_Notes
                );


            document.getElementById(
                "info-panel"
            ).innerHTML = `

                <h2>${name}</h2>


                ${
                    otherNames
                    ? `
                        <h3>Other Name</h3>

                        <p>
                            ${otherNames}
                        </p>
                      `
                    : ""
                }


                ${
                    township
                    ? `
                        <h3>Township</h3>

                        <p>
                            ${township}
                        </p>
                      `
                    : ""
                }


                ${
                    birthYear
                    ? `
                        <h3>
                            Earliest Recorded Birth Year
                        </h3>

                        <p>
                            ${birthYear}
                        </p>
                      `
                    : ""
                }


                ${
                    rowNumber
                    ? `
                        <h3>
                            Land / Survey Reference
                        </h3>

                        <p>
                            ${rowNumber}
                        </p>
                      `
                    : ""
                }


                ${
                    condition
                    ? `
                        <h3>
                            Condition / Location Notes
                        </h3>

                        <p>
                            ${condition}
                        </p>
                      `
                    : ""
                }

            `;

        }


        // ========================================================
        // IMPORTANT:
        //
        // WAIT FOR MAPLIBRE TO FINISH LOADING FIRST.
        //
        // Only after "load" fires do we fetch and add the
        // cemetery GeoJSON.
        // ========================================================

        map.on(
            "load",
            function() {

                console.log(
                    "MapLibre finished loading."
                );


                console.log(
                    "Attempting to load:",
                    GEOJSON_FILE
                );


                // =================================================
                // FETCH GEOJSON
                // =================================================

                fetch(GEOJSON_FILE)

                    .then(
                        function(response) {

                            console.log(
                                "GeoJSON HTTP status:",
                                response.status
                            );


                            if (!response.ok) {

                                throw new Error(

                                    "GeoJSON could not be loaded. " +

                                    "HTTP status: " +

                                    response.status

                                );

                            }


                            return response.json();

                        }
                    )


                    .then(
                        function(data) {

                            console.log(
                                "GeoJSON successfully parsed:",
                                data
                            );


                            // =====================================
                            // VERIFY GEOJSON
                            // =====================================

                            if (
                                !data ||
                                data.type !==
                                    "FeatureCollection" ||
                                !Array.isArray(
                                    data.features
                                )
                            ) {

                                throw new Error(
                                    "Invalid GeoJSON FeatureCollection."
                                );

                            }


                            console.log(
                                "Number of cemetery features:",
                                data.features.length
                            );


                            // =====================================
                            // ADD SOURCE
                            // =====================================

                            map.addSource(

                                "cemeteries",

                                {

                                    type:
                                        "geojson",

                                    data:
                                        data

                                }

                            );


                            console.log(
                                "Cemetery source added."
                            );


                            // =====================================
                            // ADD MARKER LAYER
                            // =====================================

                            map.addLayer({

                                id:
                                    "cemeteries-layer",

                                type:
                                    "circle",

                                source:
                                    "cemeteries",

                                paint: {

                                    "circle-radius":
                                        10,

                                    "circle-color":
                                        "#ff0000",

                                    "circle-opacity":
                                        1,

                                    "circle-stroke-width":
                                        3,

                                    "circle-stroke-color":
                                        "#ffffff",

                                    "circle-stroke-opacity":
                                        1

                                }

                            });


                            console.log(
                                "Cemetery layer added."
                            );


                            // =====================================
                            // CHECK WHETHER MAPLIBRE SEES THEM
                            // =====================================

                            map.once(
                                "idle",
                                function() {

                                    const rendered =
                                        map.queryRenderedFeatures(
                                            {
                                                layers:
                                                    [
                                                        "cemeteries-layer"
                                                    ]
                                            }
                                        );


                                    console.log(
                                        "Rendered cemetery features:",
                                        rendered
                                    );


                                    const sourceFeatures =
                                        map.querySourceFeatures(
                                            "cemeteries"
                                        );


                                    console.log(
                                        "Source cemetery features:",
                                        sourceFeatures
                                    );

                                }
                            );


                            // =====================================
                            // CLICK MARKER
                            // =====================================

                            map.on(
                                "click",
                                "cemeteries-layer",
                                function(event) {

                                    const feature =
                                        event.features &&
                                        event.features[0];


                                    if (!feature) {
                                        return;
                                    }


                                    showCemeteryInfo(
                                        feature.properties
                                    );


                                    // =================================
                                    // POPUP
                                    // =================================

                                    new maplibregl.Popup()

                                        .setLngLat(
                                            feature.geometry.coordinates
                                        )

                                        .setHTML(`

                                            <div
                                                class="popup-title"
                                            >

                                                ${escapeHTML(
                                                    feature
                                                        .properties
                                                        .Cemetery_Name
                                                )}

                                            </div>


                                            ${
                                                feature
                                                    .properties
                                                    .Other_Names

                                                ? `

                                                    <div
                                                        class=
                                                        "popup-subtitle"
                                                    >

                                                        ${escapeHTML(
                                                            feature
                                                                .properties
                                                                .Other_Names
                                                        )}

                                                    </div>

                                                  `

                                                : ""
                                            }


                                            ${
                                                feature
                                                    .properties
                                                    .Township

                                                ? `

                                                    <div>

                                                        <span
                                                            class=
                                                            "popup-label"
                                                        >
                                                            Township:
                                                        </span>

                                                        ${escapeHTML(
                                                            feature
                                                                .properties
                                                                .Township
                                                        )}

                                                    </div>

                                                  `

                                                : ""
                                            }

                                        `)

                                        .addTo(map);

                                }
                            );


                            // =====================================
                            // POINTER
                            // =====================================

                            map.on(
                                "mouseenter",
                                "cemeteries-layer",
                                function() {

                                    map.getCanvas()
                                        .style
                                        .cursor =
                                        "pointer";

                                }
                            );


                            map.on(
                                "mouseleave",
                                "cemeteries-layer",
                                function() {

                                    map.getCanvas()
                                        .style
                                        .cursor =
                                        "";

                                }
                            );

                        }
                    )


                    // =================================================
                    // GEOJSON ERROR
                    // =================================================

                    .catch(
                        function(error) {

                            console.error(
                                "Cemetery GeoJSON error:",
                                error
                            );


                            document.getElementById(
                                "info-panel"
                            ).innerHTML = `

                                <div
                                    class="error-message"
                                >

                                    <strong>
                                        Cemetery data could
                                        not be loaded.
                                    </strong>

                                    <br><br>

                                    ${escapeHTML(
                                        error.message
                                    )}

                                </div>

                            `;

                        }
                    );

            }
        );


        // ========================================================
        // MAP ERROR
        // ========================================================

        map.on(
            "error",
            function(event) {

                console.error(
                    "MapLibre error:",
                    event
                );

            }
        );


        // ========================================================
        // RESET BUTTON
        // ========================================================

        document
            .getElementById(
                "reset-button"
            )
            .addEventListener(
                "click",
                function() {

                    document
                        .getElementById(
                            "search"
                        )
                        .value = "";


                    document
                        .getElementById(
                            "year-filter"
                        )
                        .value = "";


                    if (
                        map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        map.setFilter(
                            "cemeteries-layer",
                            null
                        );

                    }


                    document.getElementById(
                        "info-panel"
                    ).innerHTML = `

                        <div
                            class="placeholder"
                        >

                            Click a cemetery marker
                            to view its information.

                        </div>

                    `;

                }
            );


        // ========================================================
        // SEARCH
        //
        // Kept simple for now. It is not used to create the
        // initial markers, so it cannot prevent them from loading.
        // ========================================================

        document
            .getElementById(
                "search"
            )
            .addEventListener(
                "input",
                function() {

                    if (
                        !map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        return;

                    }


                    const text =
                        this.value
                            .trim()
                            .toLowerCase();


                    if (!text) {

                        map.setFilter(
                            "cemeteries-layer",
                            null
                        );

                        return;

                    }


                    map.setFilter(

                        "cemeteries-layer",

                        [

                            "any",

                            [

                                "in",

                                text,

                                [

                                    "downcase",

                                    [

                                        "coalesce",

                                        [
                                            "get",
                                            "Cemetery_Name"
                                        ],

                                        ""

                                    ]

                                ]

                            ],


                            [

                                "in",

                                text,

                                [

                                    "downcase",

                                    [

                                        "coalesce",

                                        [
                                            "get",
                                            "Other_Names"
                                        ],

                                        ""

                                    ]

                                ]

                            ]

                        ]

                    );

                }
            );


        // ========================================================
        // YEAR FILTER
        // ========================================================

        document
            .getElementById(
                "year-filter"
            )
            .addEventListener(
                "input",
                function() {

                    if (
                        !map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        return;

                    }


                    if (!this.value) {

                        map.setFilter(
                            "cemeteries-layer",
                            null
                        );

                        return;

                    }


                    const year =
                        Number(this.value);


                    map.setFilter(

                        "cemeteries-layer",

                        [

                            ">=",

                            [

                                "to-number",

                                [
                                    "get",
                                    "Birth_Year"
                                ]

                            ],

                            year

                        ]

                    );

                }
            );


    </script>

</body>

</html>
