<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Franklin County Pioneer Cemeteries Archive</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    >

    <script
        src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #f4f1e8;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {
            background: #3f3528;
            color: white;
            padding: 14px 18px;
            z-index: 10;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        #controls {
            background: #eee9dc;
            border-bottom: 1px solid #c9c1b2;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            z-index: 5;
        }

        #search {
            flex: 1 1 220px;
            min-width: 180px;
            padding: 9px 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 15px;
        }


        /* =====================================================
           EARLIEST GRAVE SLIDER
           ===================================================== */

        #year-filter-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        #year-filter-label {
            font-size: 14px;
            white-space: nowrap;
            color: #3f3528;
        }

        #year-filter {
            width: 150px;
            cursor: pointer;
        }

        #year-value {
            min-width: 42px;
            font-weight: bold;
            font-size: 14px;
            color: #3f3528;
            text-align: center;
        }


        /* =====================================================
           BUTTONS
           ===================================================== */

        button {
            padding: 9px 14px;
            border: 1px solid #8d8375;
            border-radius: 4px;
            background: #5a4b3a;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #463a2d;
        }


        /* =====================================================
           MAP
           ===================================================== */

        #map {
            flex: 1;
            min-height: 0;
            width: 100%;
            position: relative;
        }


        /* =====================================================
           INFORMATION PANEL
           ===================================================== */

        #info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 310px;
            max-width: calc(100% - 20px);
            max-height: calc(100% - 20px);
            overflow-y: auto;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #aaa;
            border-radius: 5px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.25);

            padding: 14px;

            z-index: 4;
        }


        /* =====================================================
           CLOSE BUTTON
           ===================================================== */

        #close-info {
            position: absolute;
            top: 5px;
            right: 7px;

            width: 28px;
            height: 28px;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: transparent;
            color: #5a4b3a;

            font-size: 23px;
            line-height: 28px;

            cursor: pointer;
        }

        #close-info:hover {
            background: #e5e0d5;
            color: #2f281f;
        }


        /* =====================================================
           INFORMATION CONTENT
           ===================================================== */

        #info-content {
            padding-right: 24px;
        }

        #info-panel h2 {
            margin: 0 0 6px 0;
            font-size: 20px;
            color: #3f3528;
        }

        #info-panel h3 {
            margin: 12px 0 3px 0;
            font-size: 13px;
            color: #6b6258;
            text-transform: uppercase;
        }

        #info-panel p {
            margin: 0;
            line-height: 1.4;
            font-size: 14px;
        }

        .placeholder {
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }

        .error-message {
            color: #8b0000;
            font-size: 14px;
            line-height: 1.45;
        }


        /* =====================================================
           POPUP
           ===================================================== */

        .popup-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #3f3528;
        }

        .popup-subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .popup-label {
            font-weight: bold;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            header {
                padding: 11px 13px;
            }

            header h1 {
                font-size: 18px;
            }

            header p {
                font-size: 12px;
            }

            #controls {
                padding: 8px;
            }

            #search,
            button {
                width: 100%;
                flex: 1 1 100%;
            }

            #year-filter-container {
                width: 100%;
                flex: 1 1 100%;
            }

            #year-filter {
                flex: 1;
                width: auto;
            }

            #info-panel {
                position: absolute;
                top: auto;
                right: 8px;
                bottom: 8px;
                left: 8px;

                width: auto;
                max-width: none;
                max-height: 38%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header>

        <h1>
            Franklin County Pioneer Cemeteries Archive
        </h1>

        <p>
            Historic cemetery locations and associated records
        </p>

    </header>


    <!-- =========================================================
         CONTROLS
         ========================================================= -->

    <div id="controls">

        <input
            type="text"
            id="search"
            placeholder="Search cemetery name or other name..."
        >


        <div id="year-filter-container">

            <span id="year-filter-label">
                Earliest Grave:
            </span>

            <input
                type="range"
                id="year-filter"
                min="1700"
                max="1900"
                value="1700"
                step="1"
            >

            <span id="year-value">
                All
            </span>

        </div>


        <button id="reset-button">
            Reset
        </button>

    </div>


    <!-- =========================================================
         MAP
         ========================================================= -->

    <div id="map">

        <div id="info-panel">

            <button
                id="close-info"
                aria-label="Close information panel"
                title="Close"
            >
                ×
            </button>

            <div id="info-content">

                <div class="placeholder">

                    Loading cemetery data...

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        // ========================================================
        // GEOJSON FILE
        // ========================================================

        const GEOJSON_FILE =
            new URL(
                "graves.geojson",
                document.baseURI
            ).href;


        // ========================================================
        // MAP SETTINGS
        // ========================================================

        const MAP_CENTER = [
            -85.0626,
            39.3992
        ];


        const MAP_BOUNDS = [

            [
                -85.313644,
                39.263095
            ],

            [
                -84.811707,
                39.535292
            ]

        ];


        // ========================================================
        // EARLIEST GRAVE SLIDER SETTINGS
        // ========================================================

        const YEAR_MIN = 1700;
        const YEAR_MAX = 1900;
        const YEAR_DEFAULT = YEAR_MIN;


        // ========================================================
        // CREATE MAP
        // ========================================================

        const map = new maplibregl.Map({

            container: "map",

            style: {

                version: 8,

                sources: {

                    osm: {

                        type: "raster",

                        tiles: [

                            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

                        ],

                        tileSize: 256,

                        attribution:
                            "© OpenStreetMap contributors"

                    }

                },

                layers: [

                    {

                        id: "osm",

                        type: "raster",

                        source: "osm"

                    }

                ]

            },

            center: MAP_CENTER,

            zoom: 10,

            maxBounds: MAP_BOUNDS

        });


        // ========================================================
        // NAVIGATION
        // ========================================================

        map.addControl(

            new maplibregl.NavigationControl(),

            "top-left"

        );


        // ========================================================
        // HTML ESCAPING
        // ========================================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value)

                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ========================================================
        // INFO PANEL CONTENT
        // ========================================================

        function setInfoContent(html) {

            document.getElementById(
                "info-content"
            ).innerHTML = html;

        }


        // ========================================================
        // SHOW INFO PANEL
        // ========================================================

        function showInfoPanel() {

            document.getElementById(
                "info-panel"
            ).style.display = "block";

        }


        // ========================================================
        // HIDE INFO PANEL
        // ========================================================

        function hideInfoPanel() {

            document.getElementById(
                "info-panel"
            ).style.display = "none";

        }


        // ========================================================
        // SHOW CEMETERY INFORMATION
        // ========================================================

        function showCemeteryInfo(properties) {

            const name =
                escapeHTML(
                    properties.Cemetery_Name
                );

            const otherNames =
                escapeHTML(
                    properties.Other_Names
                );

            const township =
                escapeHTML(
                    properties.Township
                );

            const birthYear =
                escapeHTML(
                    properties.Birth_Year
                );

            const rowNumber =
                escapeHTML(
                    properties.Row_Number
                );

            const condition =
                escapeHTML(
                    properties.Condition_Notes
                );


            setInfoContent(`

                <h2>
                    ${name}
                </h2>

                ${
                    otherNames
                    ? `
                        <h3>
                            Other Name
                        </h3>

                        <p>
                            ${otherNames}
                        </p>
                    `
                    : ""
                }

                ${
                    township
                    ? `
                        <h3>
                            Township
                        </h3>

                        <p>
                            ${township}
                        </p>
                    `
                    : ""
                }

                ${
                    birthYear
                    ? `
                        <h3>
                            Earliest Recorded Birth Year
                        </h3>

                        <p>
                            ${birthYear}
                        </p>
                    `
                    : ""
                }

                ${
                    rowNumber
                    ? `
                        <h3>
                            Land / Survey Reference
                        </h3>

                        <p>
                            ${rowNumber}
                        </p>
                    `
                    : ""
                }

                ${
                    condition
                    ? `
                        <h3>
                            Condition / Location Notes
                        </h3>

                        <p>
                            ${condition}
                        </p>
                    `
                    : ""
                }

            `);


            showInfoPanel();

        }


        // ========================================================
        // WAIT FOR MAP TO LOAD
        // ========================================================

        map.on(
            "load",
            function() {


                // =================================================
                // LOAD GEOJSON AS TEXT
                // =================================================

                fetch(
                    GEOJSON_FILE,
                    {
                        cache: "no-store"
                    }
                )

                .then(
                    function(response) {

                        if (!response.ok) {

                            throw new Error(

                                "Could not load graves.geojson. " +
                                "HTTP status: " +
                                response.status

                            );

                        }

                        return response.text();

                    }
                )


                .then(
                    function(text) {


                        // ==========================================
                        // REMOVE UTF-8 BOM
                        // ==========================================

                        text =
                            text.replace(
                                /^\uFEFF/,
                                ""
                            );


                        // ==========================================
                        // REMOVE ACCIDENTAL WHITESPACE
                        // ==========================================

                        text =
                            text.trim();


                        // ==========================================
                        // PARSE JSON
                        // ==========================================

                        let data;


                        try {

                            data =
                                JSON.parse(text);

                        }

                        catch (error) {

                            console.error(
                                "Raw graves.geojson response:",
                                text.substring(
                                    0,
                                    500
                                )
                            );


                            throw new Error(

                                "graves.geojson is not valid JSON. " +

                                "The first character received was: " +

                                JSON.stringify(
                                    text.charAt(0)
                                )

                            );

                        }


                        // ==========================================
                        // VERIFY GEOJSON STRUCTURE
                        // ==========================================

                        if (
                            !data ||
                            data.type !==
                                "FeatureCollection" ||
                            !Array.isArray(
                                data.features
                            )
                        ) {

                            throw new Error(

                                "graves.geojson is valid JSON, " +
                                "but it is not a valid GeoJSON " +
                                "FeatureCollection."

                            );

                        }


                        // ==========================================
                        // ADD SOURCE
                        // ==========================================

                        map.addSource(

                            "cemeteries",

                            {

                                type:
                                    "geojson",

                                data:
                                    data

                            }

                        );


                        // ==========================================
                        // ADD CEMETERY DOTS
                        // ==========================================

                        map.addLayer({

                            id:
                                "cemeteries-layer",

                            type:
                                "circle",

                            source:
                                "cemeteries",

                            paint: {

                                "circle-radius":
                                    9,

                                "circle-color":
                                    "#b91c1c",

                                "circle-opacity":
                                    1,

                                "circle-stroke-width":
                                    3,

                                "circle-stroke-color":
                                    "#ffffff",

                                "circle-stroke-opacity":
                                    1

                            }

                        });


                        // ==========================================
                        // SUCCESS
                        // ==========================================

                        setInfoContent(`

                            <div
                                class="placeholder"
                            >

                                <strong>
                                    ${data.features.length}
                                </strong>

                                cemetery records loaded.

                                <br><br>

                                Click a marker to view its
                                information.

                            </div>

                        `);


                        // ==========================================
                        // CLICK MARKER
                        // ==========================================

                        map.on(

                            "click",

                            "cemeteries-layer",

                            function(event) {

                                const feature =
                                    event.features &&
                                    event.features[0];


                                if (!feature) {
                                    return;
                                }


                                showCemeteryInfo(
                                    feature.properties
                                );


                                new maplibregl.Popup()

                                    .setLngLat(
                                        feature
                                            .geometry
                                            .coordinates
                                    )

                                    .setHTML(`

                                        <div
                                            class="popup-title"
                                        >

                                            ${escapeHTML(
                                                feature
                                                    .properties
                                                    .Cemetery_Name
                                            )}

                                        </div>

                                        ${
                                            feature
                                                .properties
                                                .Other_Names

                                            ? `

                                                <div
                                                    class=
                                                    "popup-subtitle"
                                                >

                                                    ${escapeHTML(
                                                        feature
                                                            .properties
                                                            .Other_Names
                                                    )}

                                                </div>

                                            `
                                            : ""
                                        }

                                    `)

                                    .addTo(map);

                            }

                        );


                        // ==========================================
                        // POINTER
                        // ==========================================

                        map.on(

                            "mouseenter",

                            "cemeteries-layer",

                            function() {

                                map.getCanvas()
                                    .style
                                    .cursor =
                                    "pointer";

                            }

                        );


                        map.on(

                            "mouseleave",

                            "cemeteries-layer",

                            function() {

                                map.getCanvas()
                                    .style
                                    .cursor =
                                    "";

                            }

                        );

                    }
                )


                // =================================================
                // ERROR
                // =================================================

                .catch(
                    function(error) {

                        console.error(
                            "Cemetery data error:",
                            error
                        );


                        setInfoContent(`

                            <div
                                class="error-message"
                            >

                                <strong>
                                    Cemetery data could
                                    not be loaded.
                                </strong>

                                <br><br>

                                ${escapeHTML(
                                    error.message
                                )}

                            </div>

                        `);

                    }
                );

            }
        );


        // ========================================================
        // MAP ERROR
        // ========================================================

        map.on(
            "error",
            function(event) {

                console.error(
                    "MapLibre error:",
                    event
                );

            }
        );


        // ========================================================
        // CLOSE INFORMATION PANEL
        // ========================================================

        document
            .getElementById("close-info")
            .addEventListener(
                "click",
                function() {

                    hideInfoPanel();

                }
            );


        // ========================================================
        // RESET
        // ========================================================

        document
            .getElementById("reset-button")
            .addEventListener(
                "click",
                function() {

                    document
                        .getElementById("search")
                        .value = "";


                    document
                        .getElementById("year-filter")
                        .value = YEAR_DEFAULT;


                    document
                        .getElementById("year-value")
                        .textContent = "All";


                    if (
                        map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        map.setFilter(
                            "cemeteries-layer",
                            null
                        );

                    }


                    setInfoContent(`

                        <div
                            class="placeholder"
                        >

                            Click a cemetery marker
                            to view its information.

                        </div>

                    `);


                    showInfoPanel();

                }
            );


        // ========================================================
        // SEARCH
        // ========================================================

        document
            .getElementById("search")
            .addEventListener(
                "input",
                function() {

                    if (
                        !map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        return;

                    }


                    const searchText =
                        this.value
                            .trim()
                            .toLowerCase();


                    if (!searchText) {

                        map.setFilter(
                            "cemeteries-layer",
                            null
                        );

                        return;

                    }


                    map.setFilter(

                        "cemeteries-layer",

                        [

                            "any",

                            [

                                "in",

                                searchText,

                                [

                                    "downcase",

                                    [

                                        "coalesce",

                                        [
                                            "get",
                                            "Cemetery_Name"
                                        ],

                                        ""

                                    ]

                                ]

                            ],

                            [

                                "in",

                                searchText,

                                [

                                    "downcase",

                                    [

                                        "coalesce",

                                        [
                                            "get",
                                            "Other_Names"
                                        ],

                                        ""

                                    ]

                                ]

                            ]

                        ]

                    );

                }
            );


        // ========================================================
        // EARLIEST GRAVE SLIDER
        // ========================================================

        document
            .getElementById("year-filter")
            .addEventListener(
                "input",
                function() {

                    if (
                        !map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        return;

                    }


                    const year =
                        Number(
                            this.value
                        );


                    document
                        .getElementById("year-value")
                        .textContent = year;


                    // At the minimum year, show everything.

                    if (
                        year === YEAR_MIN
                    ) {

                        map.setFilter(
                            "cemeteries-layer",
                            null
                        );

                        document
                            .getElementById("year-value")
                            .textContent = "All";

                        return;

                    }


                    // Show cemeteries whose earliest
                    // recorded birth year is at or after
                    // the selected year.

                    map.setFilter(

                        "cemeteries-layer",

                        [

                            ">=",

                            [

                                "to-number",

                                [

                                    "get",

                                    "Birth_Year"

                                ]

                            ],

                            year

                        ]

                    );

                }
            );


    </script>

</body>

</html>
