<body>

```
<!-- =========================================================
     HEADER
     ========================================================= -->

<header>

    <h1>
        Franklin County Indiana Pioneer Cemeteries Archive Prototype
    </h1>

    <p>
        Historic Cemetery Locations and Associated Records
    </p>

</header>


<!-- =========================================================
     CONTROLS
     ========================================================= -->

<div id="controls">


    <!-- =====================================================
         SEARCH
         ===================================================== -->

    <div id="search-wrapper">

        <input
            type="text"
            id="search"
            placeholder="Search cemeteries or people..."
        >


        <button
            id="clear-search"
            type="button"
            title="Clear search"
        >
            &times;
        </button>

    </div>


    <!-- =====================================================
         SEARCH TOGGLES
         ===================================================== -->

    <div id="search-toggles">

        <button
            type="button"
            class="search-toggle active"
            id="search-cemetery"
        >
            Cemetery
        </button>


        <button
            type="button"
            class="search-toggle active"
            id="search-person"
        >
            Person
        </button>


        <button
            type="button"
            class="search-toggle"
            id="search-veterans"
        >
            Veterans Only
        </button>

    </div>


    <!-- =====================================================
         YEAR FILTER
         ===================================================== -->

    <div id="year-filter-container">

        <span id="year-filter-label">
            Established Before:
        </span>


        <input
            type="range"
            id="year-filter"
            min="1800"
            max="1900"
            step="5"
            value="1900"
        >


        <span id="year-value">
            All
        </span>

    </div>


    <!-- =====================================================
         RESET
         ===================================================== -->

    <button id="reset-btn">
        Reset Filters
    </button>

</div>


<!-- =========================================================
     MAP
     ========================================================= -->

<div id="map">


    <!-- =====================================================
         FLOATING INFORMATION PANEL
         ===================================================== -->

    <div id="info-panel">


        <button
            id="close-info"
            title="Close Panel"
        >
            &times;
        </button>


        <div id="info-content">

            <div class="placeholder">

                Click a cemetery marker on the map
                to inspect historic records and notes.

            </div>

        </div>

    </div>


    <!-- =====================================================
         CEMETERY PAGE LIGHTBOX
         ===================================================== -->

    <div id="cemetery-lightbox">


        <button
            id="close-cemetery-lightbox"
            title="Close Cemetery Record"
        >
            &times;
        </button>


        <iframe
            id="cemetery-lightbox-frame"
            title="Cemetery Record"
        ></iframe>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>


    // ========================================================
    // MAP SETUP
    // ========================================================

    const map =
        new maplibregl.Map({

            container: "map",

            style: {

                version: 8,

                sources: {

                    "osm-tiles": {

                        type: "raster",

                        tiles: [
                            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                        ],

                        tileSize: 256,

                        attribution:
                            "© OpenStreetMap contributors"

                    }

                },

                layers: [

                    {

                        id: "osm-layer",

                        type: "raster",

                        source: "osm-tiles"

                    }

                ]

            },

            zoom: 11,

            center: [
                -85.0626,
                39.3992
            ],

            maxBounds: [
                [-85.50, 39.10],
                [-84.65, 39.70]
            ],

            maxZoom: 18

        });


    // ========================================================
    // DOM REFERENCES
    // ========================================================

    const infoPanel =
        document.getElementById("info-panel");


    const infoContent =
        document.getElementById("info-content");


    const searchBox =
        document.getElementById("search");


    const clearSearch =
        document.getElementById("clear-search");


    const cemeteryToggle =
        document.getElementById("search-cemetery");


    const personToggle =
        document.getElementById("search-person");


    const veteransToggle =
        document.getElementById("search-veterans");


    const yearSlider =
        document.getElementById("year-filter");


    const yearVal =
        document.getElementById("year-value");


    const resetButton =
        document.getElementById("reset-btn");


    const cemeteryLightbox =
        document.getElementById(
            "cemetery-lightbox"
        );


    const cemeteryLightboxFrame =
        document.getElementById(
            "cemetery-lightbox-frame"
        );


    const closeCemeteryLightbox =
        document.getElementById(
            "close-cemetery-lightbox"
        );


    // ========================================================
    // APPLICATION STATE
    // ========================================================

    let cemeteryFeatures = [];

    let intermentsByCemetery = {};

    let intermentsLoaded = false;

    let searchCemetery = true;

    let searchPerson = true;

    let veteransOnly = false;


    // ========================================================
    // DEFAULT INFORMATION PANEL
    // ========================================================

    function showDefaultInfo() {

        infoContent.innerHTML = `

            <div class="placeholder">

                Click a cemetery marker
                on the map to inspect
                historic records and notes.

            </div>

        `;

    }


    // ========================================================
// CLOSE INFORMATION PANEL
// ========================================================

document
    .getElementById("close-info")
    .addEventListener(
        "click",
        function () {

            infoPanel.style.display = "none";

        }
    );


// ========================================================
// CLOSE INFO PANEL WHEN CLICKING OUTSIDE IT
// ========================================================

map.on("click", function (event) {

    const clickedFeatures = map.queryRenderedFeatures(
        event.point,
        {
            layers: [
                "cemeteries-layer",
                "lake-cemeteries-layer"
            ]
        }
    );

    // If we clicked a cemetery marker, let its own
    // click handler manage the information panel.
    if (clickedFeatures.length > 0) {
        return;
    }

    // Otherwise, clicking the map closes the panel.
    if (!infoPanel.contains(event.originalEvent.target)) {
        infoPanel.style.display = "none";
    }

});


    // ========================================================
    // CLOSE CEMETERY LIGHTBOX
    // ========================================================

    function closeCemeteryRecord() {

        cemeteryLightbox.style.display = "none";

        cemeteryLightboxFrame.src = "";

    }


    closeCemeteryLightbox.addEventListener(
        "click",
        closeCemeteryRecord
    );


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                cemeteryLightbox.style.display === "flex"
            ) {

                closeCemeteryRecord();

            }

        }
    );


    // ========================================================
    // SEE MORE BUTTON
    //
    // EVENT DELEGATION IS USED SO THIS CONTINUES TO WORK
    // EVEN THOUGH THE INFO PANEL CONTENT IS REBUILT.
    // ========================================================

    infoContent.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    ".see-more-button"
                );


            if (!button) {
                return;
            }


            const cemeteryID =
                button.dataset.cemeteryId;


            cemeteryLightboxFrame.src =
                "cemetery.html?id=" +
                encodeURIComponent(
                    cemeteryID
                );


            cemeteryLightbox.style.display =
                "flex";

        }
    );


    // ========================================================
    // MAP LOAD
    // ========================================================

    map.on(
        "load",
        function () {


            // =================================================
            // NAVIGATION CONTROL
            // =================================================

            map.addControl(

                new maplibregl.NavigationControl({

                    showCompass: false

                }),

                "top-right"

            );


            // =================================================
            // CSV LOCATIONS
            // =================================================

            const CSV_PATH =
                new URL(
                    "cemlist.csv",
                    document.baseURI
                ).href;


            const LAKE_CSV_PATH =
                new URL(
                    "lakecems.csv",
                    document.baseURI
                ).href;


            const INTERMENTS_CSV_PATH =
                new URL(
                    "interments.csv",
                    document.baseURI
                ).href;


            // =================================================
            // LOAD MAIN CEMETERY CSV
            // =================================================

            Papa.parse(
                CSV_PATH,
                {

                    download: true,

                    header: true,

                    skipEmptyLines: true,


                    complete:
                        function (results) {


                            // =================================
                            // STORAGE FOR MAP FEATURES
                            // =================================

                            const mapFeatures = [];


                            // =================================
                            // PROCESS EVERY CSV ROW
                            // =================================

                            results.data.forEach(
                                function (row) {


                                    // -----------------------------
                                    // COORDINATES
                                    // -----------------------------

                                    const lat =
                                        parseFloat(
                                            row.LAT
                                        );


                                    const lon =
                                        parseFloat(
                                            row.LONG
                                        );


                                    // -----------------------------
                                    // GRAVE COUNT
                                    // -----------------------------

                                    const graveCount =
                                        row["COUNT"] === undefined ||
                                        String(
                                            row["COUNT"]
                                        ).trim() === ""
                                            ? -1
                                            : parseInt(
                                                row["COUNT"],
                                                10
                                            );


                                    // -----------------------------
                                    // ACCESSIBILITY
                                    // -----------------------------

                                    const access =
                                        parseInt(
                                            row.ACCESS,
                                            10
                                        );


                                    // -----------------------------
                                    // APPROXIMATE SIZE
                                    // -----------------------------

                                    const approximateSize =
                                        row[
                                            "APPROXIMATE SIZE"
                                        ] || "";


                                    // -----------------------------
                                    // STATUS
                                    // -----------------------------

                                    const status =
                                        parseInt(
                                            row.STATUS,
                                            10
                                        );


                                    // -----------------------------
                                    // VETERANS
                                    // -----------------------------

                                    const vets =
                                        parseInt(
                                            row.VETS,
                                            10
                                        );


                                    // -----------------------------
                                    // ONLY CREATE MARKER
                                    // IF COORDINATES ARE VALID
                                    // -----------------------------

                                    if (
                                        !isNaN(lat) &&
                                        !isNaN(lon)
                                    ) {


                                        mapFeatures.push({

                                            type: "Feature",


                                            properties: {

                                                Cemetery_ID:
                                                    row.ID || "",


                                                Cemetery_Name:
                                                    row.NAME || "",


                                                Other_Names:
                                                    row[
                                                        "OTHER NAMES"
                                                    ] || "",


                                                Township:
                                                    row.TOWNSHIP || "",


                                                Established_Year:
                                                    parseInt(
                                                        row["EST."],
                                                        10
                                                    ) || 0,


                                                Grid_Index:
                                                    row[
                                                        "MAP LOCATION"
                                                    ] || "",


                                                General_Notes:
                                                    row.NOTES || "",


                                                Condition_Notes:
                                                    row.CONDITION || "",


                                                Grave_Count:
                                                    graveCount,


                                                Access:
                                                    isNaN(access)
                                                        ? -1
                                                        : access,


                                                Approximate_Size:
                                                    approximateSize,


                                                Status:
                                                    isNaN(status)
                                                        ? -1
                                                        : status,


                                                Vets:
                                                    isNaN(vets)
                                                        ? -1
                                                        : vets,


                                                Search_Match:
                                                    false,


                                                Search_Active:
                                                    false

                                            },


                                            geometry: {

                                                type: "Point",

                                                coordinates: [
                                                    lon,
                                                    lat
                                                ]

                                            }

                                        });

                                    }

                                }
                            );


                            // =================================
                            // SAVE FEATURES FOR SEARCH
                            // =================================

                            cemeteryFeatures =
                                mapFeatures;


                            // =================================
                            // ADD CEMETERY DATA SOURCE
                            // =================================

                            map.addSource(

                                "cemeteries-data",

                                {

                                    type: "geojson",

                                    data: {

                                        type:
                                            "FeatureCollection",

                                        features:
                                            mapFeatures

                                    }

                                }

                            );


                            // =================================
                            // MAIN CEMETERY MARKER LAYER
                            // =================================

                            map.addLayer({

                                id:
                                    "cemeteries-layer",

                                type:
                                    "circle",

                                source:
                                    "cemeteries-data",

                                paint: {

                                    "circle-radius": [

                                        "case",

                                        [
                                            "<",
                                            [
                                                "get",
                                                "Grave_Count"
                                            ],
                                            0
                                        ],

                                        8,


                                        [
                                            "step",

                                            [
                                                "get",
                                                "Grave_Count"
                                            ],

                                            6,

                                            25,
                                            8,

                                            100,
                                            11,

                                            250,
                                            14,

                                            500,
                                            18

                                        ]

                                    ],


                                    "circle-color": [

                                        "case",

                                        [
                                            "<",
                                            [
                                                "get",
                                                "Grave_Count"
                                            ],
                                            0
                                        ],

                                        "#777777",


                                        [
                                            "match",

                                            [
                                                "get",
                                                "Access"
                                            ],

                                            0,
                                            "#8B0000",

                                            1,
                                            "#D2691E",

                                            2,
                                            "#C9A227",

                                            3,
                                            "#01796F",

                                            "#777777"

                                        ]

                                    ],


                                    "circle-stroke-width":
                                        2,


                                    "circle-stroke-color":
                                        "#ffffff"

                                }

                            });


                            // =================================
                            // SEARCH HIGHLIGHT LAYER
                            // =================================

                            map.addLayer({

                                id:
                                    "cemeteries-highlight-layer",

                                type:
                                    "circle",

                                source:
                                    "cemeteries-data",

                                filter: [

                                    "all",

                                    [
                                        "==",

                                        [
                                            "get",
                                            "Search_Active"
                                        ],

                                        true

                                    ],

                                    [
                                        "==",

                                        [
                                            "get",
                                            "Search_Match"
                                        ],

                                        true

                                    ]

                                ],

                                paint: {

                                    "circle-radius":
                                        12,

                                    "circle-color":
                                        "#ffffff",

                                    "circle-opacity":
                                        0,

                                    "circle-stroke-width":
                                        4,

                                    "circle-stroke-color":
                                        "#FFD700",

                                    "circle-stroke-opacity":
                                        0.95

                                }

                            });


                            // =================================
                            // MAIN MARKER CLICK
                            // =================================

                            map.on(
                                "click",
                                "cemeteries-layer",
                                handleCemeteryClick
                            );


                            // =================================
                            // MAIN MARKER CURSOR
                            // =================================

                            map.on(
                                "mouseenter",
                                "cemeteries-layer",
                                function () {

                                    map.getCanvas()
                                        .style.cursor =
                                        "pointer";

                                }
                            );


                            map.on(
                                "mouseleave",
                                "cemeteries-layer",
                                function () {

                                    map.getCanvas()
                                        .style.cursor =
                                        "";

                                }
                            );


                            // =================================
                            // LOAD INTERMENTS
                            // =================================

                            Papa.parse(

                                INTERMENTS_CSV_PATH,

                                {

                                    download: true,

                                    header: true,

                                    skipEmptyLines: true,


                                    complete:
                                        function (
                                            intermentResults
                                        ) {


                                            intermentsByCemetery =
                                                {};


                                            intermentResults.data.forEach(
                                                function (row) {


                                                    const cemeteryID =
                                                        String(
                                                            row.CEMETERY_ID ||
                                                            ""
                                                        ).trim();


                                                    if (
                                                        !cemeteryID
                                                    ) {

                                                        return;

                                                    }


                                                    if (
                                                        !intermentsByCemetery[
                                                            cemeteryID
                                                        ]
                                                    ) {

                                                        intermentsByCemetery[
                                                            cemeteryID
                                                        ] = {

                                                            people:
                                                                [],

                                                            veteran:
                                                                false

                                                        };

                                                    }


                                                    const firstName =
                                                        String(
                                                            row[
                                                                "FIRST NAME"
                                                            ] || ""
                                                        ).trim();


                                                    const lastName =
                                                        String(
                                                            row[
                                                                "LAST NAME"
                                                            ] || ""
                                                        ).trim();


                                                    const fullName =
                                                        (
                                                            firstName +
                                                            " " +
                                                            lastName
                                                        ).trim();


                                                    if (
                                                        fullName
                                                    ) {

                                                        intermentsByCemetery[
                                                            cemeteryID
                                                        ].people.push(
                                                            fullName
                                                        );

                                                    }


                                                    if (
                                                        String(
                                                            row.VETERAN ||
                                                            ""
                                                        ).trim() ===
                                                        "1"
                                                    ) {

                                                        intermentsByCemetery[
                                                            cemeteryID
                                                        ].veteran =
                                                            true;

                                                    }

                                                }
                                            );


                                            intermentsLoaded =
                                                true;


                                            // Refresh search
                                            // now that people
                                            // are available.

                                            processMapFilters();

                                        },


                                    error:
                                        function (error) {

                                            console.error(
                                                "interments.csv loading error:",
                                                error
                                            );

                                        }

                                }

                            );


                            // =================================
                            // LOAD HISTORIC CEMETERIES
                            // =================================

                            Papa.parse(

                                LAKE_CSV_PATH,

                                {

                                    download: true,

                                    header: true,

                                    skipEmptyLines: true,


                                    complete:
                                        function (
                                            lakeResults
                                        ) {


                                            const lakeCemeteries =
                                                lakeResults.data.filter(
                                                    function (row) {

                                                        return String(
                                                            row.NAME ||
                                                            ""
                                                        ).trim() !== "";

                                                    }
                                                );


                                            // =========================
                                            // NO HISTORIC RECORDS
                                            // =========================

                                            if (
                                                lakeCemeteries.length ===
                                                0
                                            ) {

                                                processMapFilters();

                                                return;

                                            }


                                            // =========================
                                            // REPRESENTATIVE LOCATION
                                            // =========================

                                            const lakeLocation = [

                                                -84.99056446430546,

                                                39.471294950413316

                                            ];


                                            // =========================
                                            // HISTORIC DATA SOURCE
                                            // =========================

                                            map.addSource(

                                                "lake-cemeteries-data",

                                                {

                                                    type:
                                                        "geojson",

                                                    data: {

                                                        type:
                                                            "FeatureCollection",

                                                        features: [

                                                            {

                                                                type:
                                                                    "Feature",

                                                                properties: {

                                                                    Cemetery_Count:
                                                                        lakeCemeteries.length

                                                                },

                                                                geometry: {

                                                                    type:
                                                                        "Point",

                                                                    coordinates:
                                                                        lakeLocation

                                                                }

                                                            }

                                                        ]

                                                    }

                                                }

                                            );


                                            // =========================
                                            // HISTORIC MARKER
                                            // =========================

                                            map.addLayer({

                                                id:
                                                    "lake-cemeteries-layer",

                                                type:
                                                    "circle",

                                                source:
                                                    "lake-cemeteries-data",

                                                paint: {

                                                    "circle-radius":
                                                        16,

                                                    "circle-color":
                                                        "#555555",

                                                    "circle-opacity":
                                                        0.65,

                                                    "circle-stroke-width":
                                                        3,

                                                    "circle-stroke-color":
                                                        "#222222",

                                                    "circle-stroke-opacity":
                                                        0.8

                                                }

                                            });


                                            // =========================
                                            // HISTORIC MARKER CLICK
                                            // =========================

                                            map.on(

                                                "click",

                                                "lake-cemeteries-layer",

                                                function () {


                                                    infoPanel.style.display =
                                                        "block";


                                                    let cemeteryList =
                                                        "";


                                                    lakeCemeteries.forEach(
                                                        function (row) {


                                                            cemeteryList += `

                                                                <div class="lake-cemetery">

                                                                    <h3>
                                                                        ${
                                                                            row.NAME ||
                                                                            "Unnamed Cemetery"
                                                                        }
                                                                    </h3>


                                                                    ${
                                                                        row[
                                                                            "ALTERNATE NAME"
                                                                        ]
                                                                            ? `

                                                                                <div class="popup-field">

                                                                                    <span class="popup-label">
                                                                                        Alternate Name:
                                                                                    </span>

                                                                                    <span>
                                                                                        ${
                                                                                            row[
                                                                                                "ALTERNATE NAME"
                                                                                            ]
                                                                                        }
                                                                                    </span>

                                                                                </div>

                                                                            `
                                                                            : ""
                                                                    }


                                                                    ${
                                                                        row.DESIGNATION
                                                                            ? `

                                                                                <div class="popup-field">

                                                                                    <span class="popup-label">
                                                                                        Designation:
                                                                                    </span>

                                                                                    <span>
                                                                                        ${
                                                                                            row.DESIGNATION
                                                                                        }
                                                                                    </span>

                                                                                </div>

                                                                            `
                                                                            : ""
                                                                    }


                                                                    ${
                                                                        row[
                                                                            "ORIGINAL LOCATION"
                                                                        ]
                                                                            ? `

                                                                                <div class="popup-field">

                                                                                    <span class="popup-label">
                                                                                        Original Location:
                                                                                    </span>

                                                                                    <span>
                                                                                        ${
                                                                                            row[
                                                                                                "ORIGINAL LOCATION"
                                                                                            ]
                                                                                        }
                                                                                    </span>

                                                                                </div>

                                                                            `
                                                                            : ""
                                                                    }


                                                                    ${
                                                                        row.TOWNSHIP
                                                                            ? `

                                                                                <div class="popup-field">

                                                                                    <span class="popup-label">
                                                                                        Township:
                                                                                    </span>

                                                                                    <span>
                                                                                        ${
                                                                                            row.TOWNSHIP
                                                                                        }
                                                                                    </span>

                                                                                </div>

                                                                            `
                                                                            : ""
                                                                    }


                                                                    ${
                                                                        row[
                                                                            "MOVED TO"
                                                                        ]
                                                                            ? `

                                                                                <div class="popup-field">

                                                                                    <span class="popup-label">
                                                                                        Moved To:
                                                                                    </span>

                                                                                    <span>
                                                                                        ${
                                                                                            row[
                                                                                                "MOVED TO"
                                                                                            ]
                                                                                        }
                                                                                    </span>

                                                                                </div>

                                                                            `
                                                                            : ""
                                                                    }


                                                                    ${
                                                                        row.NOTES
                                                                            ? `

                                                                                <div class="popup-field">

                                                                                    <span class="popup-label">
                                                                                        Notes:
                                                                                    </span>

                                                                                    <span>
                                                                                        ${
                                                                                            row.NOTES
                                                                                        }
                                                                                    </span>

                                                                                </div>

                                                                            `
                                                                            : ""
                                                                    }

                                                                </div>

                                                            `;

                                                        }
                                                    );


                                                    infoContent.innerHTML = `

                                                        <h2>
                                                            Historic Fairfield Cemeteries
                                                        </h2>


                                                        <p class="lake-introduction">

                                                            Cemeteries affected by
                                                            the construction of
                                                            Brookville Lake.

                                                            Individual former
                                                            cemetery locations are
                                                            not currently mapped.

                                                        </p>


                                                        <p class="lake-introduction">

                                                            <strong>
                                                                ${
                                                                    lakeCemeteries.length
                                                                }
                                                            </strong>

                                                            documented
                                                            ${
                                                                lakeCemeteries.length ===
                                                                1
                                                                    ? "cemetery"
                                                                    : "cemeteries"
                                                            }.

                                                        </p>


                                                        ${cemeteryList}

                                                    `;

                                                }

                                            );


                                            // =========================
                                            // HISTORIC MARKER CURSOR
                                            // =========================

                                            map.on(

                                                "mouseenter",

                                                "lake-cemeteries-layer",

                                                function () {

                                                    map.getCanvas()
                                                        .style.cursor =
                                                        "pointer";

                                                }

                                            );


                                            map.on(

                                                "mouseleave",

                                                "lake-cemeteries-layer",

                                                function () {

                                                    map.getCanvas()
                                                        .style.cursor =
                                                        "";

                                                }

                                            );


                                            processMapFilters();

                                        },


                                    error:
                                        function (error) {

                                            console.error(
                                                "lakecems.csv loading error:",
                                                error
                                            );


                                            processMapFilters();

                                        }

                                }

                            );

                        },


                    error:
                        function (error) {

                            console.error(
                                "cemlist.csv loading error:",
                                error
                            );


                            infoContent.innerHTML = `

                                <div class="error-message">

                                    <strong>Error:</strong>

                                    Unable to load
                                    cemlist.csv.

                                    <br><br>

                                    Make sure the file is uploaded
                                    to the same repository folder
                                    as index.html.

                                </div>

                            `;

                        }

                }

            );

        }


    );


    // ========================================================
    // CEMETERY MARKER CLICK HANDLER
    // ========================================================

    function handleCemeteryClick(event) {


        if (
            !event.features ||
            !event.features.length
        ) {

            return;

        }


        const props =
            event.features[0].properties;


        infoPanel.style.display =
            "block";


        // ====================================================
        // ACCESSIBILITY
        // ====================================================

        let accessText =
            "Unknown";


        if (
            Number(props.Access) === 0
        ) {

            accessText =
                "Inaccessible";

        }

        else if (
            Number(props.Access) === 1
        ) {

            accessText =
                "Private Land";

        }

        else if (
            Number(props.Access) === 2
        ) {

            accessText =
                "With Permission";

        }

        else if (
            Number(props.Access) === 3
        ) {

            accessText =
                "Public";

        }


        // ====================================================
        // STATUS
        // ====================================================

        let statusText =
            "Unknown";


        if (
            Number(props.Status) === 1
        ) {

            statusText =
                "Inactive";

        }

        else if (
            Number(props.Status) === 2
        ) {

            statusText =
                "Active";

        }


        // ====================================================
        // VETERAN INFORMATION
        // ====================================================

        let vetsText =
            "Unknown";


        if (
            Number(props.Vets) === 1
        ) {

            vetsText =
                "Yes";

        }

        else if (
            Number(props.Vets) === 2
        ) {

            vetsText =
                "No";

        }


        // ====================================================
        // GRAVE COUNT
        // ====================================================

        const graveCountText =
            Number(props.Grave_Count) >= 0
                ? `${props.Grave_Count} Visible`
                : "Unknown";


        // ====================================================
        // BUILD INFORMATION PANEL
        // ====================================================

        infoContent.innerHTML = `

            <img
                src="photos/${encodeURIComponent(
                    props.Cemetery_ID
                )}.jpg"
                alt="${
                    props.Cemetery_Name ||
                    "Cemetery"
                }"
                class="cemetery-popup-photo"
                onerror="this.style.display='none';"
            >


            <h2>
                ${
                    props.Cemetery_Name ||
                    "Unknown Site"
                }
            </h2>


            <h3>
                Alternate Name
            </h3>


            <p>
                ${
                    props.Other_Names ||
                    "None Recorded"
                }
            </p>


            <h3>
                Location Metadata
            </h3>


            <div class="popup-field">

                <span class="popup-label">
                    Township:
                </span>

                <span>
                    ${
                        props.Township ||
                        "Unlisted"
                    }
                </span>

            </div>


            <div class="popup-field">

                <span class="popup-label">
                    Map Location/Grid:
                </span>

                <span>
                    ${
                        props.Grid_Index ||
                        "N/A"
                    }
                </span>

            </div>


            <h3>
                Established
            </h3>


            <div class="popup-field">

                <span class="popup-label">
                    Year:
                </span>

                <span>
                    ${
                        Number(
                            props.Established_Year
                        ) > 0
                            ? props.Established_Year
                            : "Unknown"
                    }
                </span>

            </div>


            <h3>
                Cemetery Information
            </h3>


            <div class="popup-field">

                <span class="popup-label">
                    Grave Count:
                </span>

                <span>
                    ${graveCountText}
                </span>

            </div>


            <div class="popup-field">

                <span class="popup-label">
                    Approximate Size:
                </span>

                <span>
                    ${
                        props.Approximate_Size ||
                        "Unknown"
                    }
                </span>

            </div>


            <div class="popup-field">

                <span class="popup-label">
                    Status:
                </span>

                <span>
                    ${statusText}
                </span>

            </div>


            <div class="popup-field">

                <span class="popup-label">
                    Accessibility:
                </span>

                <span>
                    ${accessText}
                </span>

            </div>


            <div class="popup-field">

                <span class="popup-label">
                    Veterans:
                </span>

                <span>
                    ${vetsText}
                </span>

            </div>


            <h3>
                Condition Status
            </h3>


            <p>
                ${
                    props.Condition_Notes ||
                    "No condition information on file."
                }
            </p>


            <h3>
                Location Notes
            </h3>


            <p>
                ${
                    props.General_Notes ||
                    "No notes currently recorded."
                }
            </p>


            <h3>
                Records Status
            </h3>


            <p>

                <button
                    type="button"
                    class="see-more-button"
                    data-cemetery-id="${encodeURIComponent(
                        props.Cemetery_ID
                    )}"
                >
                    SEE MORE
                </button>

            </p>

        `;

    }


    // ========================================================
    // SEARCH / FILTER PROCESSOR
    // ========================================================

    function processMapFilters() {


        // ====================================================
        // READ SEARCH
        // ====================================================

        const searchStr =
            searchBox.value
                .toLowerCase()
                .trim();


        const filterYear =
            parseInt(
                yearSlider.value,
                10
            );


        const searchIsActive =
            searchStr !== "" ||
            veteransOnly;


        // ====================================================
        // CLEAR BUTTON
        // ====================================================

        clearSearch.style.display =
            searchBox.value !== ""
                ? "block"
                : "none";


        // ====================================================
        // YEAR DISPLAY
        // ====================================================

        if (
            filterYear < 1900
        ) {

            yearVal.innerText =
                filterYear;

        }

        else {

            yearVal.innerText =
                "All";

        }


        // ====================================================
        // CALCULATE SEARCH MATCHES
        // ====================================================

        cemeteryFeatures.forEach(
            function (feature) {


                const props =
                    feature.properties;


                const cemeteryID =
                    String(
                        props.Cemetery_ID || ""
                    ).trim();


                const cemeteryText =
                    (
                        String(
                            props.Cemetery_Name ||
                            ""
                        ) +
                        " " +
                        String(
                            props.Other_Names ||
                            ""
                        )
                    )
                        .toLowerCase();


                const intermentData =
                    intermentsByCemetery[
                        cemeteryID
                    ] || {

                        people: [],

                        veteran: false

                    };


                const personText =
                    intermentData.people
                        .join(" ")
                        .toLowerCase();


                // ==========================================
                // TEXT MATCH
                // ==========================================

                let textMatch =
                    searchStr === "";


                if (
                    searchStr !== ""
                ) {

                    textMatch =
                        false;


                    if (
                        searchCemetery &&
                        cemeteryText.includes(
                            searchStr
                        )
                    ) {

                        textMatch =
                            true;

                    }


                    if (
                        searchPerson &&
                        personText.includes(
                            searchStr
                        )
                    ) {

                        textMatch =
                            true;

                    }

                }


                // ==========================================
                // VETERAN MATCH
                //
                // Either:
                // cemlist.csv VETS = 1
                //
                // OR:
                // interments.csv VETERAN = 1
                // ==========================================

                const hasVeteran =
                    Number(props.Vets) === 1 ||
                    intermentData.veteran;


                const veteranMatch =
                    !veteransOnly ||
                    hasVeteran;


                // ==========================================
                // FINAL SEARCH MATCH
                // ==========================================

                const finalMatch =
                    textMatch &&
                    veteranMatch;


                props.Search_Match =
                    finalMatch;


                props.Search_Active =
                    searchIsActive;

            }
        );


        // ====================================================
        // UPDATE MAP SOURCE
        // ====================================================

        const source =
            map.getSource(
                "cemeteries-data"
            );


        if (source) {

            source.setData({

                type:
                    "FeatureCollection",

                features:
                    cemeteryFeatures

            });

        }


        // ====================================================
        // BUILD MAP FILTER
        // ====================================================

        const activeFilters = [
            "all"
        ];


        // ====================================================
        // YEAR FILTER
        // ====================================================

        if (
            filterYear < 1900
        ) {

            activeFilters.push([

                "all",

                [
                    ">",
                    [
                        "get",
                        "Established_Year"
                    ],
                    0
                ],

                [
                    "<=",
                    [
                        "get",
                        "Established_Year"
                    ],
                    filterYear
                ]

            ]);

        }


        // ====================================================
        // SEARCH FILTER
        // ====================================================

        if (
            searchIsActive
        ) {

            activeFilters.push([

                "==",

                [
                    "get",
                    "Search_Match"
                ],

                true

            ]);

        }


        // ====================================================
        // APPLY MAIN CEMETERY FILTER
        // ====================================================

        if (
            activeFilters.length > 1
        ) {

            map.setFilter(

                "cemeteries-layer",

                activeFilters

            );

        }

        else {

            map.setFilter(

                "cemeteries-layer",

                null

            );

        }


        // ====================================================
        // APPLY HIGHLIGHT FILTER
        // ====================================================

        if (
            searchIsActive
        ) {

            map.setFilter(

                "cemeteries-highlight-layer",

                [

                    "all",

                    [
                        "==",

                        [
                            "get",
                            "Search_Active"
                        ],

                        true

                    ],

                    [
                        "==",

                        [
                            "get",
                            "Search_Match"
                        ],

                        true

                    ]

                ]

            );

        }

        else {

            map.setFilter(

                "cemeteries-highlight-layer",

                [

                    "==",

                    [
                        "get",
                        "Search_Active"
                    ],

                    true

                ]

            );

        }

    }


    // ========================================================
    // SEARCH INPUT
    // ========================================================

    searchBox.addEventListener(
        "input",
        processMapFilters
    );


    // ========================================================
    // CLEAR SEARCH
    // ========================================================

    clearSearch.addEventListener(
        "click",
        function () {

            searchBox.value = "";

            processMapFilters();

            searchBox.focus();

        }
    );


    // ========================================================
    // CEMETERY SEARCH TOGGLE
    // ========================================================

    cemeteryToggle.addEventListener(
        "click",
        function () {

            searchCemetery =
                !searchCemetery;


            cemeteryToggle.classList.toggle(
                "active",
                searchCemetery
            );


            processMapFilters();

        }
    );


    // ========================================================
    // PERSON SEARCH TOGGLE
    // ========================================================

    personToggle.addEventListener(
        "click",
        function () {

            searchPerson =
                !searchPerson;


            personToggle.classList.toggle(
                "active",
                searchPerson
            );


            processMapFilters();

        }
    );


    // ========================================================
    // VETERAN TOGGLE
    // ========================================================

    veteransToggle.addEventListener(
        "click",
        function () {

            veteransOnly =
                !veteransOnly;


            veteransToggle.classList.toggle(
                "active",
                veteransOnly
            );


            processMapFilters();

        }
    );


    // ========================================================
    // YEAR SLIDER
    // ========================================================

    yearSlider.addEventListener(
        "input",
        processMapFilters
    );


    // ========================================================
    // RESET FILTERS
    // ========================================================

    resetButton.addEventListener(
        "click",
        function () {


            // -----------------------------------------------
            // SEARCH
            // -----------------------------------------------

            searchBox.value =
                "";


            searchCemetery =
                true;


            searchPerson =
                true;


            veteransOnly =
                false;


            // -----------------------------------------------
            // TOGGLE VISUAL STATE
            // -----------------------------------------------

            cemeteryToggle.classList.add(
                "active"
            );


            personToggle.classList.add(
                "active"
            );


            veteransToggle.classList.remove(
                "active"
            );


            // -----------------------------------------------
            // YEAR
            // -----------------------------------------------

            yearSlider.value =
                1900;


            yearVal.innerText =
                "All";


            // -----------------------------------------------
            // REPROCESS FILTERS
            // -----------------------------------------------

            processMapFilters();


            // -----------------------------------------------
            // RESTORE INFO PANEL
            // -----------------------------------------------

            infoPanel.style.display =
                "block";


            showDefaultInfo();

        }
    );


</script>
