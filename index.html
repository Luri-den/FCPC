<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Franklin County Pioneer Cemeteries Archive</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    >

    <script
        src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            display: flex;
            flex-direction: column;

            background: #f4f1e8;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {

            background: #3f3528;

            color: white;

            padding: 14px 18px;

            z-index: 10;

        }


        header h1 {

            margin:
                0 0 5px 0;

            font-size: 22px;

        }


        header p {

            margin: 0;

            font-size: 14px;

            opacity: 0.9;

        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        #controls {

            background: #eee9dc;

            border-bottom:
                1px solid #c9c1b2;

            padding: 10px;

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            align-items: center;

            z-index: 5;

        }


        #search {

            flex:
                1 1 220px;

            min-width: 180px;

            padding:
                9px 10px;

            border:
                1px solid #aaa;

            border-radius: 4px;

            font-size: 15px;

        }


        #year-filter {

            width: 150px;

            padding:
                9px 10px;

            border:
                1px solid #aaa;

            border-radius: 4px;

            font-size: 15px;

            background: white;

        }


        button {

            padding:
                9px 14px;

            border:
                1px solid #8d8375;

            border-radius: 4px;

            background: #5a4b3a;

            color: white;

            font-size: 14px;

            cursor: pointer;

        }


        button:hover {

            background: #463a2d;

        }


        /* =====================================================
           MAP
           ===================================================== */

        #map {

            flex: 1;

            min-height: 0;

            width: 100%;

            position: relative;

        }


        /* =====================================================
           INFORMATION PANEL
           ===================================================== */

        #info-panel {

            position: absolute;

            top: 10px;
            right: 10px;

            width: 310px;

            max-width:
                calc(100% - 20px);

            max-height:
                calc(100% - 20px);

            overflow-y: auto;

            background:
                rgba(255, 255, 255, 0.96);

            border:
                1px solid #aaa;

            border-radius: 5px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.25);

            padding: 14px;

            z-index: 4;

        }


        #info-panel h2 {

            margin:
                0 0 6px 0;

            font-size: 20px;

            color: #3f3528;

        }


        #info-panel h3 {

            margin:
                12px 0 3px 0;

            font-size: 13px;

            color: #6b6258;

            text-transform:
                uppercase;

        }


        #info-panel p {

            margin: 0;

            line-height: 1.4;

            font-size: 14px;

        }


        .placeholder {

            color: #666;

            font-size: 14px;

            line-height: 1.4;

        }


        .error-message {

            color: #8b0000;

            font-size: 14px;

            line-height: 1.45;

        }


        .success-message {

            color: #315d35;

            font-size: 14px;

            line-height: 1.45;

        }


        .debug-box {

            margin-top: 10px;

            padding: 8px;

            background: #f1f1f1;

            border:
                1px solid #ccc;

            border-radius: 3px;

            font-family:
                monospace;

            font-size: 11px;

            word-break: break-word;

            white-space: pre-wrap;

        }


        /* =====================================================
           POPUP
           ===================================================== */

        .popup-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;

            color: #3f3528;

        }


        .popup-subtitle {

            font-size: 13px;

            color: #666;

            margin-bottom: 8px;

        }


        .popup-label {

            font-weight: bold;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            header {

                padding:
                    11px 13px;

            }


            header h1 {

                font-size: 18px;

            }


            header p {

                font-size: 12px;

            }


            #controls {

                padding: 8px;

            }


            #search,
            #year-filter,
            button {

                width: 100%;

                flex:
                    1 1 100%;

            }


            #info-panel {

                position: absolute;

                top: auto;

                right: 8px;
                bottom: 8px;
                left: 8px;

                width: auto;

                max-width: none;

                max-height: 38%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header>

        <h1>
            Franklin County Pioneer Cemeteries Archive
        </h1>

        <p>
            Historic cemetery locations and associated records
        </p>

    </header>


    <!-- =========================================================
         CONTROLS
         ========================================================= -->

    <div id="controls">

        <input
            type="text"
            id="search"
            placeholder="Search cemetery name or other name..."
        >

        <input
            type="number"
            id="year-filter"
            placeholder="Birth year..."
        >

        <button id="reset-button">
            Reset
        </button>

    </div>


    <!-- =========================================================
         MAP
         ========================================================= -->

    <div id="map">

        <div id="info-panel">

            <div class="placeholder">

                Loading map...

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        // ========================================================
        // GEOJSON FILE
        // ========================================================

        const GEOJSON_FILE =
            new URL(
                "graves.geojson",
                document.baseURI
            ).href;


        // ========================================================
        // MAP SETTINGS
        // ========================================================

        const MAP_CENTER = [
            -85.0626,
            39.3992
        ];


        const MAP_BOUNDS = [

            [
                -85.313644,
                39.263095
            ],

            [
                -84.811707,
                39.535292
            ]

        ];


        // ========================================================
        // CREATE MAP
        // ========================================================

        const map = new maplibregl.Map({

            container:
                "map",

            style: {

                version: 8,

                sources: {

                    osm: {

                        type:
                            "raster",

                        tiles: [

                            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

                        ],

                        tileSize:
                            256,

                        attribution:
                            "© OpenStreetMap contributors"

                    }

                },

                layers: [

                    {

                        id:
                            "osm",

                        type:
                            "raster",

                        source:
                            "osm"

                    }

                ]

            },

            center:
                MAP_CENTER,

            zoom:
                10,

            maxBounds:
                MAP_BOUNDS

        });


        // ========================================================
        // NAVIGATION CONTROL
        // ========================================================

        map.addControl(

            new maplibregl.NavigationControl(),

            "top-left"

        );


        // ========================================================
        // HTML ESCAPE
        // ========================================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ========================================================
        // SHOW CEMETERY INFORMATION
        // ========================================================

        function showCemeteryInfo(properties) {

            const name =
                escapeHTML(
                    properties.Cemetery_Name
                );


            const otherNames =
                escapeHTML(
                    properties.Other_Names
                );


            const township =
                escapeHTML(
                    properties.Township
                );


            const birthYear =
                escapeHTML(
                    properties.Birth_Year
                );


            const rowNumber =
                escapeHTML(
                    properties.Row_Number
                );


            const condition =
                escapeHTML(
                    properties.Condition_Notes
                );


            document.getElementById(
                "info-panel"
            ).innerHTML = `

                <h2>
                    ${name}
                </h2>


                ${
                    otherNames
                    ? `

                        <h3>
                            Other Name
                        </h3>

                        <p>
                            ${otherNames}
                        </p>

                      `
                    : ""
                }


                ${
                    township
                    ? `

                        <h3>
                            Township
                        </h3>

                        <p>
                            ${township}
                        </p>

                      `
                    : ""
                }


                ${
                    birthYear
                    ? `

                        <h3>
                            Earliest Recorded Birth Year
                        </h3>

                        <p>
                            ${birthYear}
                        </p>

                      `
                    : ""
                }


                ${
                    rowNumber
                    ? `

                        <h3>
                            Land / Survey Reference
                        </h3>

                        <p>
                            ${rowNumber}
                        </p>

                      `
                    : ""
                }


                ${
                    condition
                    ? `

                        <h3>
                            Condition / Location Notes
                        </h3>

                        <p>
                            ${condition}
                        </p>

                      `
                    : ""
                }

            `;

        }


        // ========================================================
        // MAP LOAD
        //
        // We wait until MapLibre is completely ready before
        // attempting to load the GeoJSON.
        // ========================================================

        map.on(
            "load",
            function() {


                console.log(
                    "================================"
                );

                console.log(
                    "MAP LOADED"
                );

                console.log(
                    "GeoJSON URL:"
                );

                console.log(
                    GEOJSON_FILE
                );

                console.log(
                    "================================"
                );


                // ================================================
                // FETCH THE FILE AS TEXT FIRST
                //
                // This is intentional.
                //
                // We want to see EXACTLY what GitHub Pages
                // is returning before JSON.parse() is attempted.
                // ================================================

                fetch(
                    GEOJSON_FILE,
                    {
                        cache: "no-store"
                    }
                )

                .then(
                    function(response) {


                        console.log(
                            "GeoJSON HTTP status:",
                            response.status
                        );


                        console.log(
                            "GeoJSON Content-Type:",
                            response.headers.get(
                                "content-type"
                            )
                        );


                        if (!response.ok) {

                            throw new Error(

                                "HTTP " +
                                response.status +
                                " while loading graves.geojson."

                            );

                        }


                        return response.text();

                    }
                )


                .then(
                    function(text) {


                        // ========================================
                        // SHOW WHAT THE SERVER ACTUALLY RETURNED
                        // ========================================

                        console.log(
                            "================================"
                        );

                        console.log(
                            "FIRST 500 CHARACTERS RETURNED:"
                        );

                        console.log(
                            text.substring(
                                0,
                                500
                            )
                        );

                        console.log(
                            "================================"
                        );


                        // ========================================
                        // PARSE JSON MANUALLY
                        // ========================================

                        let data;


                        try {

                            data =
                                JSON.parse(
                                    text
                                );

                        }

                        catch (error) {

                            const beginning =
                                text
                                    .substring(
                                        0,
                                        200
                                    )
                                    .replace(
                                        /\s+/g,
                                        " "
                                    );


                            throw new Error(

                                "The server returned something " +
                                "that is NOT valid JSON.\n\n" +

                                "The beginning of the response was:\n\n" +

                                beginning

                            );

                        }


                        console.log(
                            "GeoJSON parsed successfully:",
                            data
                        );


                        // ========================================
                        // VALIDATE GEOJSON
                        // ========================================

                        if (
                            !data ||
                            data.type !==
                                "FeatureCollection" ||
                            !Array.isArray(
                                data.features
                            )
                        ) {

                            throw new Error(

                                "The file was parsed as JSON, " +
                                "but it is not a valid " +
                                "GeoJSON FeatureCollection."

                            );

                        }


                        console.log(
                            "Number of features:",
                            data.features.length
                        );


                        // ========================================
                        // LIST THE FEATURES
                        // ========================================

                        data.features.forEach(

                            function(feature, index) {

                                console.log(

                                    "Feature " +
                                    (index + 1) +
                                    ":",

                                    feature

                                );

                            }

                        );


                        // ========================================
                        // ADD SOURCE
                        // ========================================

                        map.addSource(

                            "cemeteries",

                            {

                                type:
                                    "geojson",

                                data:
                                    data

                            }

                        );


                        console.log(
                            "Cemetery GeoJSON source added."
                        );


                        // ========================================
                        // ADD DOTS
                        // ========================================

                        map.addLayer({

                            id:
                                "cemeteries-layer",

                            type:
                                "circle",

                            source:
                                "cemeteries",

                            paint: {

                                "circle-radius":
                                    10,

                                "circle-color":
                                    "#ff0000",

                                "circle-opacity":
                                    1,

                                "circle-stroke-width":
                                    3,

                                "circle-stroke-color":
                                    "#ffffff",

                                "circle-stroke-opacity":
                                    1

                            }

                        });


                        console.log(
                            "Cemetery dot layer added."
                        );


                        // ========================================
                        // SUCCESS MESSAGE
                        // ========================================

                        document.getElementById(
                            "info-panel"
                        ).innerHTML = `

                            <div
                                class="success-message"
                            >

                                <strong>
                                    Cemetery data loaded.
                                </strong>

                                <br><br>

                                ${data.features.length}
                                cemetery records loaded.

                            </div>

                        `;


                        // ========================================
                        // WAIT FOR RENDER
                        // ========================================

                        map.once(

                            "idle",

                            function() {


                                const rendered =
                                    map.queryRenderedFeatures(

                                        {

                                            layers:
                                                [
                                                    "cemeteries-layer"
                                                ]

                                        }

                                    );


                                const sourceFeatures =
                                    map.querySourceFeatures(

                                        "cemeteries"

                                    );


                                console.log(
                                    "Rendered cemetery features:",
                                    rendered
                                );


                                console.log(
                                    "Source cemetery features:",
                                    sourceFeatures
                                );


                            }

                        );


                        // ========================================
                        // MARKER CLICK
                        // ========================================

                        map.on(

                            "click",

                            "cemeteries-layer",

                            function(event) {


                                const feature =
                                    event.features &&
                                    event.features[0];


                                if (!feature) {

                                    return;

                                }


                                showCemeteryInfo(

                                    feature.properties

                                );


                                new maplibregl.Popup()

                                    .setLngLat(

                                        feature
                                            .geometry
                                            .coordinates

                                    )

                                    .setHTML(`

                                        <div
                                            class=
                                            "popup-title"
                                        >

                                            ${escapeHTML(
                                                feature
                                                    .properties
                                                    .Cemetery_Name
                                            )}

                                        </div>


                                        ${
                                            feature
                                                .properties
                                                .Other_Names

                                            ? `

                                                <div
                                                    class=
                                                    "popup-subtitle"
                                                >

                                                    ${escapeHTML(
                                                        feature
                                                            .properties
                                                            .Other_Names
                                                    )}

                                                </div>

                                              `

                                            : ""
                                        }


                                        ${
                                            feature
                                                .properties
                                                .Township

                                            ? `

                                                <div>

                                                    <span
                                                        class=
                                                        "popup-label"
                                                    >
                                                        Township:
                                                    </span>

                                                    ${escapeHTML(
                                                        feature
                                                            .properties
                                                            .Township
                                                    )}

                                                </div>

                                              `

                                            : ""
                                        }

                                    `)

                                    .addTo(
                                        map
                                    );

                            }

                        );


                        // ========================================
                        // POINTER
                        // ========================================

                        map.on(

                            "mouseenter",

                            "cemeteries-layer",

                            function() {

                                map.getCanvas()
                                    .style
                                    .cursor =
                                    "pointer";

                            }

                        );


                        map.on(

                            "mouseleave",

                            "cemeteries-layer",

                            function() {

                                map.getCanvas()
                                    .style
                                    .cursor =
                                    "";

                            }

                        );


                    }

                )


                // =================================================
                // ERROR
                // =================================================

                .catch(

                    function(error) {


                        console.error(
                            "================================"
                        );

                        console.error(
                            "CEMETERY DATA ERROR"
                        );

                        console.error(
                            error
                        );

                        console.error(
                            "================================"
                        );


                        document.getElementById(
                            "info-panel"
                        ).innerHTML = `

                            <div
                                class="error-message"
                            >

                                <strong>
                                    Cemetery data could
                                    not be loaded.
                                </strong>

                                <br><br>

                                ${escapeHTML(
                                    error.message
                                )}

                                <div
                                    class="debug-box"
                                >

                                    Requested URL:

                                    ${escapeHTML(
                                        GEOJSON_FILE
                                    )}

                                </div>

                                <br>

                                Open the browser's
                                developer console to see
                                exactly what the server
                                returned.

                            </div>

                        `;

                    }

                );

            }

        );


        // ========================================================
        // MAP ERROR
        // ========================================================

        map.on(

            "error",

            function(event) {

                console.error(
                    "MapLibre error:",
                    event
                );

            }

        );


        // ========================================================
        // RESET
        // ========================================================

        document
            .getElementById(
                "reset-button"
            )
            .addEventListener(

                "click",

                function() {


                    document
                        .getElementById(
                            "search"
                        )
                        .value = "";


                    document
                        .getElementById(
                            "year-filter"
                        )
                        .value = "";


                    if (
                        map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        map.setFilter(

                            "cemeteries-layer",

                            null

                        );

                    }


                    document.getElementById(
                        "info-panel"
                    ).innerHTML = `

                        <div
                            class="placeholder"
                        >

                            Click a cemetery marker
                            to view its information.

                        </div>

                    `;

                }

            );


        // ========================================================
        // SEARCH
        // ========================================================

        document
            .getElementById(
                "search"
            )
            .addEventListener(

                "input",

                function() {


                    if (
                        !map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        return;

                    }


                    const searchText =
                        this.value
                            .trim()
                            .toLowerCase();


                    if (!searchText) {

                        map.setFilter(

                            "cemeteries-layer",

                            null

                        );

                        return;

                    }


                    map.setFilter(

                        "cemeteries-layer",

                        [

                            "any",

                            [

                                "in",

                                searchText,

                                [

                                    "downcase",

                                    [

                                        "coalesce",

                                        [

                                            "get",

                                            "Cemetery_Name"

                                        ],

                                        ""

                                    ]

                                ]

                            ],


                            [

                                "in",

                                searchText,

                                [

                                    "downcase",

                                    [

                                        "coalesce",

                                        [

                                            "get",

                                            "Other_Names"

                                        ],

                                        ""

                                    ]

                                ]

                            ]

                        ]

                    );

                }

            );


        // ========================================================
        // YEAR FILTER
        // ========================================================

        document
            .getElementById(
                "year-filter"
            )
            .addEventListener(

                "input",

                function() {


                    if (
                        !map.getLayer(
                            "cemeteries-layer"
                        )
                    ) {

                        return;

                    }


                    if (!this.value) {

                        map.setFilter(

                            "cemeteries-layer",

                            null

                        );

                        return;

                    }


                    const year =
                        Number(
                            this.value
                        );


                    map.setFilter(

                        "cemeteries-layer",

                        [

                            ">=",

                            [

                                "to-number",

                                [

                                    "get",

                                    "Birth_Year"

                                ]

                            ],

                            year

                        ]

                    );

                }

            );


    </script>

</body>

</html>
