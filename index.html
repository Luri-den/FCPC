<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franklin County Pioneer Cemeteries Archive</title>
    
    <!-- MapLibre Core Stylesheet and Engine -->
    <link href="https://unpkg.com" rel="stylesheet" />
    <script src="https://unpkg.com"></script>

    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; color: #333; }
        #sidebar { width: 380px; background: #fafafa; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        .header-panel { padding: 20px; background: #1e293b; color: white; }
        .header-panel h1 { margin: 0 0 5px 0; font-size: 1.3rem; }
        .header-panel p { margin: 0; font-size: 0.85rem; color: #94a3b8; }
        .control-panel { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; background: white; }
        .search-box { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .slider-container { display: flex; flex-direction: column; gap: 5px; }
        .slider-label { font-size: 0.85rem; font-weight: 600; color: #475569; display: flex; justify-content: space-between; }
        #timeline-slider { width: 100%; margin: 8px 0; }
        #info-panel { padding: 20px; overflow-y: auto; flex-grow: 1; background: white; }
        .placeholder-text { color: #94a3b8; font-style: italic; text-align: center; margin-top: 40px; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .meta-item { background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #f1f5f9; }
        .meta-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
        .meta-value { font-size: 0.95rem; font-weight: 600; color: #0f172a; }
        #map { flex-grow: 1; height: 100%; background-color: #cbd5e1; }
    </style>
</head>
<body>

    <!-- Left Dashboard Control Panel -->
    <div id="sidebar">
        <div class="header-panel">
            <h1>Franklin County Cemeteries</h1>
            <p>Pioneer Graves & Records Archive</p>
        </div>
        <div class="control-panel">
            <!-- Cemetery Search Input Bar -->
            <input type="text" id="search-input" class="search-box" placeholder="Search by cemetery name..." />
            
            <!-- Restored Decade Timeline Slider -->
            <div class="slider-container">
                <div class="slider-label">
                    <span>Show Sites Established Before:</span>
                    <span id="slider-value">All Years</span>
                </div>
                <input type="range" id="timeline-slider" min="1800" max="1900" step = "10" value="1900" />
            </div>
        </div>
        <div id="info-panel">
            <div class="placeholder-text">Click a red cemetery marker on the map to inspect historical details and county commission notes.</div>
        </div>
    </div>

    <!-- Right Interactive Map Element -->
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            zoom: 11,
            center: [-85.0626, 39.3992], // Centers view directly on Franklin County, IN
            maxBounds: [
                [-85.313644, 39.263095], // Safe-rail bounds derived from your custom coordinates box
                [-84.811707, 39.535292]
            ],
            maxZoom: 20,
            style: {
                version: 8,
                sources: {
                    "osm-tiles": {
                        type: "raster",
                        tiles: [
                            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
                            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png"
                        ],
                        tileSize: 256,
                        attribution: "© OpenStreetMap contributors"
                    }
                },
                layers: [
                    {
                        id: "osm-layer",
                        type: "raster",
                        source: "osm-tiles"
                    }
                ]
            }
        });

        map.on('load', () => {
            map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

            // Hook up the graves.geojson dataset file 
            map.addSource('cemeteries-source', {
                type: 'geojson',
                data: './graves.geojson'
            });

            // Map data layer to drop coordinates points down on our map grid landscape
            map.addLayer({
                id: 'cemeteries-layer',
                type: 'circle',
                source: 'cemeteries-source',
                paint: {
                    'circle-radius': 10,
                    'circle-color': '#b91c1c', // Pioneer red dots markers
                    'circle-stroke-width': 2.5,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Handle map pin click events to update metadata elements inside the sidebar window panel
            map.on('click', 'cemeteries-layer', (e) => {
                const props = e.features[properties];
                const infoPanel = document.getElementById('info-panel');

                infoPanel.innerHTML = `
                    <h2 style="margin:0 0 5px 0; font-size:1.4rem; color:#0f172a;">${props.Cemetery_Name || 'Unknown Site'}</h2>
                    <p style="margin:0; color:#475569; font-size:0.9rem;">Alternate: <strong>${props.Other_Names || 'None'}</strong></p>
                    <p style="margin:3px 0 0 0; color:#475569; font-size:0.9rem;">Township: <strong>${props.Township || 'Unknown'}</strong></p>
                    
                    <div class="meta-grid">
                        <div class="meta-item"><div class="meta-label">Est. Year</div><div class="meta-value">${props.Birth_Year || 'N/A'}</div></div>
                        <div class="meta-item"><div class="meta-label">Grid Log</div><div class="meta-value" style="font-size:0.75rem;">${props.Row_Number || 'N/A'}</div></div>
                    </div>

                    <div style="margin-top:20px; padding-top:15px; border-top:1px solid #e2e8f0;">
                        <h4 style="margin:0 0 5px 0; font-size:0.8rem; text-transform:uppercase; color:#64748b; letter-spacing:0.05em;">Commission Records & Notes</h4>
                        <p style="margin:0; font-size:0.95rem; line-height:1.5; color:#334155;">${props.Condition_Notes || 'No notes on file.'}</p>
                    </div>
                `;
            });

            map.on('mouseenter', 'cemeteries-layer', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'cemeteries-layer', () => map.getCanvas().style.cursor = '');

            // Interactive Search and Slider filtering framework engine routines
            const searchInput = document.getElementById('search-input');
            const timelineSlider = document.getElementById('timeline-slider');
            const sliderValueDisplay = document.getElementById('slider-value');

            function applyFilters() {
                const text = searchInput.value.toLowerCase().trim();
                const selectedYear = parseInt(timelineSlider.value);
                
                let expressionsStack = ['all'];

                // 1. Evaluate Timeline Boundary threshold limits (Birth_Year column mapping)
                if (selectedYear < 1900) {
                    sliderValueDisplay.innerText = "Before " + selectedYear;
                    expressionsStack.push(['<=', ['number', ['get', 'Birth_Year']], selectedYear]);
                } else {
                    sliderValueDisplay.innerText = "All Years";
                }

                // 2. Evaluate String Pattern Text terms searches
                if (text !== "") {
                    expressionsStack.push([
                        'any',
                        ['like', ['downcase', ['to-string', ['get', 'Cemetery_Name']]], text],
                        ['like', ['downcase', ['to-string', ['get', 'Other_Names']]], text]
                    ]);
                }

                // Apply conditions layers
                if (expressionsStack.length > 1) {
                    map.setFilter('cemeteries-layer', expressionsStack);
                } else {
                    map.setFilter('cemeteries-layer', null);
                }
            }

            searchInput.addEventListener('input', applyFilters);
            timelineSlider.addEventListener('input', applyFilters);
        });
    </script>
</body>
</html>
