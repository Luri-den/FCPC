<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Franklin County Indiana Pioneer Cemeteries Archive Prototype
</title>


<!-- =========================================================
     MAPLIBRE
     ========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<script
    src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
></script>


<!-- =========================================================
     PAPAPARSE
     ========================================================= -->

<script
    src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"
></script>


<!-- =========================================================
     STYLE
     ========================================================= -->

<style>

    * {
        box-sizing: border-box;
    }


    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
    }


    body {
        display: flex;
        flex-direction: column;
        background: #f4f1e8;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {
        background: #01796F;
        color: white;
        padding: 14px 18px;
        z-index: 10;
    }


    header h1 {
        margin: 0 0 5px 0;
        font-size: 22px;
    }


    header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
    }


    /* =====================================================
       CONTROLS
       ===================================================== */

    #controls {
        background: #eee9dc;
        border-bottom: 1px solid #c9c1b2;
        padding: 10px;

        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;

        z-index: 5;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    #search-wrapper {
        position: relative;

        flex: 1 1 220px;
        min-width: 180px;
    }


    #search {
        width: 100%;

        padding: 9px 34px 9px 10px;

        border: 1px solid #aaa;
        border-radius: 4px;

        font-size: 15px;
    }


    #clear-search {
        position: absolute;

        top: 50%;
        right: 5px;

        transform: translateY(-50%);

        width: 26px;
        height: 26px;

        padding: 0;

        border: none;
        border-radius: 50%;

        background: transparent;
        color: #777;

        font-size: 20px;
        line-height: 26px;

        cursor: pointer;

        display: none;
    }


    #clear-search:hover {
        background: #e5e0d5;
        color: #333;
    }


    /* =====================================================
       SEARCH TOGGLES
       ===================================================== */

    #search-toggles {
        display: flex;
        gap: 4px;
        align-items: center;
    }


    .search-toggle {
        padding: 8px 11px;

        border: 1px solid #aaa;
        border-radius: 4px;

        background: #ddd8cc;
        color: #463a2d;

        font-size: 13px;
        font-weight: normal;

        cursor: pointer;
    }


    .search-toggle:hover {
        background: #cfc8bb;
    }


    .search-toggle.active {
        background: #01796F;
        border-color: #01796F;
        color: white;
    }


    .search-toggle.active:hover {
        background: #463a2d;
        border-color: #463a2d;
    }


    /* =====================================================
       YEAR FILTER
       ===================================================== */

    #year-filter-container {
        display: flex;
        align-items: center;
        gap: 8px;

        padding: 0 4px;
    }


    #year-filter-label {
        font-size: 14px;
        white-space: nowrap;
        color: #3f3528;
    }


    #year-filter {
        width: 150px;
        cursor: pointer;
    }


    #year-value {
        min-width: 42px;

        font-weight: bold;
        font-size: 14px;

        color: #3f3528;

        text-align: center;
    }


    /* =====================================================
       GENERAL BUTTONS
       ===================================================== */

    button {
        padding: 9px 14px;

        border: 1px solid #8d8375;
        border-radius: 4px;

        background: #01796F;
        color: white;

        font-size: 14px;

        cursor: pointer;
    }


    button:hover {
        background: #463a2d;
    }


    /* =====================================================
       SEE MORE BUTTON
       ===================================================== */

    .see-more-button {
        display: block;

        width: 100%;

        padding: 10px 14px;

        border: 1px solid #8d8375;
        border-radius: 4px;

        background: #01796F;
        color: white;

        font-size: 14px;
        font-weight: bold;

        text-align: center;

        cursor: pointer;
    }


    .see-more-button:hover {
        background: #463a2d;
    }


    /* =====================================================
       CEMETERY POPUP PHOTO
       ===================================================== */

    .cemetery-popup-photo {
        display: block;

        width: 100%;
        height: auto;

        max-height: 220px;

        object-fit: contain;

        margin: 0 0 12px 0;

        border-radius: 4px;
    }


    /* =====================================================
       POPUP LABEL / VALUE FIELDS
       ===================================================== */

    .popup-field {
        display: grid;

        grid-template-columns: 130px 1fr;

        column-gap: 10px;

        margin-bottom: 8px;
    }


    .popup-label {
        font-weight: bold;
    }


    /* =====================================================
       HISTORICAL CEMETERY LIST
       ===================================================== */

    .lake-cemetery {
        border-top: 1px solid #ddd;

        padding: 12px 0;
    }


    .lake-cemetery:first-child {
        border-top: none;
    }


    .lake-cemetery h3 {
        margin: 0 0 10px 0;

        font-size: 16px;

        color: #463a2d;
    }


    .lake-introduction {
        margin: 0 0 12px 0;

        line-height: 1.4;
        font-size: 14px;
    }


    /* =====================================================
       MAP
       ===================================================== */

    #map {
        flex: 1;

        min-height: 0;

        width: 100%;

        position: relative;
    }


    /* =====================================================
       INFO PANEL
       ===================================================== */

    #info-panel {
        position: absolute;

        top: 10px;
        right: 10px;

        width: 310px;

        max-width: calc(100% - 20px);
        max-height: calc(100% - 20px);

        overflow-y: auto;

        background: rgba(255, 255, 255, 0.96);

        border: 1px solid #aaa;
        border-radius: 5px;

        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.25);

        padding: 14px;

        z-index: 4;
    }


    #close-info {
        position: absolute;

        top: 5px;
        right: 7px;

        width: 28px;
        height: 28px;

        padding: 0;

        border: none;
        border-radius: 50%;

        background: transparent;

        color: #5a4b3a;

        font-size: 23px;
        line-height: 28px;

        cursor: pointer;
    }


    #close-info:hover {
        background: #e5e0d5;
        color: #2f281f;
    }


    #info-content {
        padding-right: 24px;
    }


    #info-panel h2 {
        margin: 0 0 6px 0;

        font-size: 20px;

        color: #3f3528;
    }


    #info-panel h3 {
        margin: 12px 0 3px 0;

        font-size: 13px;

        color: #6b6258;

        text-transform: uppercase;
    }


    #info-panel p {
        margin: 0;

        line-height: 1.4;

        font-size: 14px;
    }


    .placeholder {
        color: #666;

        font-size: 14px;

        line-height: 1.4;
    }


    .error-message {
        color: #8b0000;

        font-size: 14px;

        line-height: 1.45;
    }


    /* =====================================================
       CEMETERY LIGHTBOX
       ===================================================== */

    #cemetery-lightbox {
        display: none;

        position: absolute;

        inset: 0;

        background: rgba(0, 0, 0, 0.78);

        z-index: 20;

        align-items: center;
        justify-content: center;

        padding: 20px;
    }


    #cemetery-lightbox-frame {
        width: min(1100px, 95%);
        height: min(850px, 92%);

        border: none;

        border-radius: 5px;

        background: white;

        box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.4);
    }


    #close-cemetery-lightbox {
        position: absolute;

        top: 15px;
        right: 20px;

        width: 38px;
        height: 38px;

        padding: 0;

        border: none;
        border-radius: 50%;

        background: rgba(255, 255, 255, 0.92);

        color: #3f3528;

        font-size: 28px;
        line-height: 38px;

        cursor: pointer;

        z-index: 21;
    }


    #close-cemetery-lightbox:hover {
        background: white;
        color: #01796F;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

        header {
            padding: 11px 13px;
        }


        header h1 {
            font-size: 18px;
        }


        header p {
            font-size: 12px;
        }


        #controls {
            padding: 8px;
        }


        #search,
        #controls > button {
            width: 100%;
            flex: 1 1 100%;
        }


        #search-toggles {
            width: 100%;
            flex: 1 1 100%;
        }


        .search-toggle {
            flex: 1;
        }


        #year-filter-container {
            width: 100%;
            flex: 1 1 100%;
        }


        #year-filter {
            flex: 1;
            width: auto;
        }


        #info-panel {
            position: absolute;

            top: auto;
            right: 8px;
            bottom: 8px;
            left: 8px;

            width: auto;

            max-width: none;
            max-height: 65%;
        }


        .popup-field {
            grid-template-columns: 120px 1fr;
        }


        #cemetery-lightbox {
            padding: 10px;
        }


        #cemetery-lightbox-frame {
            width: 100%;
            height: 90%;
        }


        #close-cemetery-lightbox {
            top: 5px;
            right: 8px;
        }

    }

</style>
```
