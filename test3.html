<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#01796F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>Franklin County Indiana Pioneer Cemeteries Archive</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f4f1e8; overflow: hidden;
    }

    body { display: flex; flex-direction: column; }

    /* ---------- FULLSCREEN MAP ---------- */
    #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* ---------- FLOATING TOP APP BAR ---------- */
    .app-top-bar {
        position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        background: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-radius: 28px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .county-logo {
        width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .county-logo svg { width: 100%; height: 100%; fill: #01796F; stroke: #015851; stroke-width: 1.5; }

    #search-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
    #search {
        width: 100%; padding: 8px 30px 8px 10px; border: none; background: transparent;
        font-size: 15px; outline: none; color: #1a1a1a;
    }
    #clear-search {
        position: absolute; right: 4px; border: none; background: transparent;
        font-size: 18px; color: #777; cursor: pointer; display: none; padding: 4px;
    }

    .app-bar-btn {
        background: #01796F; color: white; border: none; border-radius: 20px;
        padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer;
        display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .app-bar-btn:hover { background: #463a2d; }

    /* ---------- RIGHT FLOATING ACTION STACK ---------- */
    .fab-stack {
        position: absolute; top: 76px; right: 12px; z-index: 10;
        display: flex; flex-direction: column; gap: 10px;
    }

    .fab-btn {
        width: 44px; height: 44px; border-radius: 50%; border: none;
        background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px);
        box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; color: #3f3528; transition: transform 0.15s, background 0.2s;
    }
    .fab-btn:active { transform: scale(0.92); }
    .fab-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* ---------- DRAWER / BOTTOM SHEET OVERLAYS ---------- */
    .sheet-panel {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-top-left-radius: 24px; border-top-right-radius: 24px;
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
        transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .sheet-panel.open { transform: translateY(0); }

    .sheet-drag-handle {
        width: 100%; height: 24px; display: flex; align-items: center; justify-content: center;
        cursor: grab; touch-action: none; flex-shrink: 0;
    }
    .sheet-drag-handle::before {
        content: ""; width: 40px; height: 5px; background: #ccc; border-radius: 3px;
    }

    .sheet-body { padding: 0 20px 24px 20px; overflow-y: auto; flex: 1; }

    /* ---------- PREVIEW & STATS ---------- */
    .preview-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .preview-title { margin: 0; font-size: 20px; color: #222; font-weight: bold; }
    
    .stat-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; background: #f4f1e8; padding: 12px; border-radius: 12px;
    }
    .stat-box { text-align: center; }
    .stat-val { font-size: 18px; font-weight: bold; color: #01796F; }
    .stat-lbl { font-size: 11px; text-transform: uppercase; color: #666; font-weight: bold; }

    /* ---------- LEGEND & CONTROLS ---------- */
    .filter-section { margin-bottom: 20px; }
    .filter-section h3 { margin: 0 0 8px 0; font-size: 13px; font-weight: bold; color: #555; text-transform: uppercase; }

    .basemap-switch { display: flex; gap: 8px; }
    .basemap-opt {
        flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: white;
        text-align: center; font-size: 13px; cursor: pointer; font-weight: bold; color: #444;
    }
    .basemap-opt.active { background: #01796F; color: white; border-color: #01796F; }

    .legend-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }

    .see-more-btn {
        width: 100%; padding: 12px; background: #01796F; color: white; border: none;
        border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px;
    }
    .export-btn {
        width: 100%; padding: 10px; background: transparent; color: #01796F; border: 1px solid #01796F;
        border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 8px;
    }

    /* ---------- LIGHTBOX ---------- */
    #cemetery-lightbox {
        display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); z-index: 200;
        align-items: center; justify-content: center; padding: 20px;
    }
    #cemetery-lightbox-frame { width: min(1100px, 95%); height: min(850px, 92%); border: none; border-radius: 8px; background: white; }
    #close-cemetery-lightbox {
        position: absolute; top: 15px; right: 20px; width: 38px; height: 38px; border: none; border-radius: 50%;
        background: white; color: #3f3528; font-size: 28px; cursor: pointer; z-index: 201;
    }
</style>
</head>

<body>

<!-- 1. FULLSCREEN MAP CANVAS -->
<div id="map" role="region" aria-label="Interactive map"></div>

<!-- 2. FLOATING TOP APP BAR WITH FRANKLIN COUNTY SVG OUTLINE -->
<header class="app-top-bar">
    <div class="county-logo" title="Franklin County, Indiana">
        <svg viewBox="0 0 100 100" aria-label="Franklin County Outline">
            <path d="M 15 15 L 85 15 L 85 85 L 35 85 L 35 65 L 15 65 Z" />
        </svg>
    </div>
    <div id="search-wrapper">
        <input type="text" id="search" placeholder="Search cemeteries or people..." aria-label="Search">
        <button id="clear-search" type="button" title="Clear search">&times;</button>
        <div id="search-results" role="group"></div>
    </div>
    <button class="app-bar-btn" id="open-filters-btn" type="button">
        <span>Filters</span>
    </button>
</header>

<!-- 3. RIGHT FAB STACK -->
<div class="fab-stack">
    <button class="fab-btn" id="reset-fab" title="Reset Map View">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
</div>

<!-- 4. FILTERS & LAYERS DRAWER -->
<div id="filters-sheet" class="sheet-panel">
    <div class="sheet-drag-handle" id="filters-drag"></div>
    <div class="sheet-body">
        <h2>Map Layers & Controls</h2>
        
        <div class="filter-section">
            <h3>Basemap View</h3>
            <div class="basemap-switch">
                <button type="button" class="basemap-opt active" data-basemap="street">Street</button>
                <button type="button" class="basemap-opt" data-basemap="aerial">Aerial</button>
            </div>
        </div>

        <div class="filter-section">
            <h3>Historical Overlay Maps</h3>
            <div id="historical-toggle-container"></div>
            <div style="margin-top: 10px;">
                <label style="font-size: 12px; color: #666;">Opacity: <span id="opacity-value-label">80%</span></label>
                <input type="range" id="historical-opacity-slider" min="0" max="100" value="80" style="width: 100%;">
            </div>
        </div>

        <div class="filter-section">
            <h3>Accessibility Legend</h3>
            <div class="legend-row"><span class="legend-dot" style="background:#01796F;"></span> Public</div>
            <div class="legend-row"><span class="legend-dot" style="background:#C9A227;"></span> With Permission</div>
            <div class="legend-row"><span class="legend-dot" style="background:#D2691E;"></span> Private Land</div>
            <div class="legend-row"><span class="legend-dot" style="background:#8B0000;"></span> Inaccessible</div>
        </div>
    </div>
</div>

<!-- 5. CEMETERY RECORD PREVIEW SHEET -->
<div id="record-sheet" class="sheet-panel">
    <div class="sheet-drag-handle" id="record-drag"></div>
    <div class="sheet-body" id="record-content"></div>
</div>

<!-- 6. LIGHTBOX -->
<div id="cemetery-lightbox" role="dialog" aria-modal="true">
    <button id="close-cemetery-lightbox" title="Close">&times;</button>
    <iframe id="cemetery-lightbox-frame" title="Cemetery Record"></iframe>
</div>

<script>
const DEFAULT_CENTER = [-85.0626, 39.3992];
const DEFAULT_ZOOM = 11;

const map = new maplibregl.Map({
    container: "map",
    style: {
        version: 8,
        sources: {
            "osm-tiles": { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 19 },
            "usgs-tiles": { type: "raster", tiles: ["https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 16 }
        },
        layers: [
            { id: "osm-layer", type: "raster", source: "osm-tiles" },
            { id: "usgs-layer", type: "raster", source: "usgs-tiles", layout: { visibility: "none" } }
        ]
    },
    zoom: DEFAULT_ZOOM,
    center: DEFAULT_CENTER,
    maxBounds: [[-85.50, 39.10], [-84.65, 39.70]]
});

// ============================================================
// CANVAS-GENERATED ACCESS MARKS (FROM TEST2)
// ============================================================
const ACCESS_MARK_FILTER = ["any", ["==", ["get", "Access"], 0], ["==", ["get", "Access"], 1], ["==", ["get", "Access"], 2]];

function makeAccessMark(kind) {
    const size = 64;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const c = size / 2, r = 12;

    function tracePath() {
        ctx.beginPath();
        if (kind === "inaccessible") {
            ctx.moveTo(c - r, c - r); ctx.lineTo(c + r, c + r);
            ctx.moveTo(c + r, c - r); ctx.lineTo(c - r, c + r);
        } else if (kind === "private") {
            ctx.moveTo(c - r, c - r); ctx.lineTo(c + r, c + r);
        } else {
            ctx.moveTo(c - r, c); ctx.lineTo(c + r, c);
        }
    }

    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(0, 0, 0, 0.75)"; ctx.lineWidth = 12; tracePath(); ctx.stroke();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 7.5; tracePath(); ctx.stroke();

    return { width: size, height: size, data: ctx.getImageData(0, 0, size, size).data };
}

function registerAccessMarks() {
    ["inaccessible", "private", "permission"].forEach(kind => {
        const name = "access-mark-" + kind;
        if (!map.hasImage(name)) map.addImage(name, makeAccessMark(kind), { pixelRatio: 2 });
    });
}

// ============================================================
// CANVAS-GENERATED GRAVE SYMBOLS (FROM TEST2)
// ============================================================
const GRAVE_INK = "#3f3528";
const GRAVE_ICON_SIZE = 34;

function drawGraveSymbol(ctx, cx, cy, opts) {
    const square = opts.shape === "square";
    const half = square ? 5.5 : 6;
    const ring = half + 2.75;

    function outline(r) {
        ctx.beginPath();
        if (square) ctx.rect(cx - r, cy - r, r * 2, r * 2);
        else ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }

    ctx.lineJoin = "miter"; ctx.setLineDash([]);
    if (opts.veteran) {
        outline(ring);
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3.5; ctx.stroke();
        ctx.strokeStyle = GRAVE_INK; ctx.lineWidth = 1.5; ctx.stroke();
    }

    outline(half);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = opts.faded ? "#cfcabe" : GRAVE_INK; ctx.fill();

    if (opts.dot) { outline(2.4); ctx.fillStyle = "#ffffff"; ctx.fill(); }

    if (opts.pioneer) {
        const top = opts.veteran ? ring + 1.75 : half + 1;
        ctx.beginPath();
        ctx.moveTo(cx - 3.5, cy - top - 5.5);
        ctx.lineTo(cx + 3.5, cy - top - 5.5);
        ctx.lineTo(cx, cy - top - 0.5);
        ctx.closePath();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = GRAVE_INK; ctx.fill();
    }
}

function makeGraveSymbol(opts) {
    const px = GRAVE_ICON_SIZE * 2;
    const canvas = document.createElement("canvas");
    canvas.width = px; canvas.height = px;
    const ctx = canvas.getContext("2d");
    ctx.scale(2, 2);
    drawGraveSymbol(ctx, GRAVE_ICON_SIZE / 2, GRAVE_ICON_SIZE / 2, opts);
    return { width: px, height: px, data: ctx.getImageData(0, 0, px, px).data };
}

function registerGraveSymbols() {
    ["circle", "square"].forEach(shape => {
        [false, true].forEach(dot => {
            [false, true].forEach(veteran => {
                [false, true].forEach(pioneer => {
                    const name = "grave-" + shape + (dot ? "-dot" : "") + (veteran ? "-vet" : "") + (pioneer ? "-pio" : "");
                    if (!map.hasImage(name)) map.addImage(name, makeGraveSymbol({ shape, dot, veteran, pioneer }), { pixelRatio: 2 });
                });
            });
        });
    });
}

// ============================================================
// UI DRAWER & LIGHTBOX CONTROLS
// ============================================================
const filtersSheet = document.getElementById("filters-sheet");
const recordSheet = document.getElementById("record-sheet");
const recordContent = document.getElementById("record-content");
const cemeteryLightbox = document.getElementById("cemetery-lightbox");
const cemeteryLightboxFrame = document.getElementById("cemetery-lightbox-frame");

document.getElementById("open-filters-btn").addEventListener("click", () => filtersSheet.classList.toggle("open"));
document.getElementById("filters-drag").addEventListener("click", () => filtersSheet.classList.remove("open"));
document.getElementById("record-drag").addEventListener("click", () => recordSheet.classList.remove("open"));
document.getElementById("reset-fab").addEventListener("click", exitCemeteryMode);

function exitCemeteryMode() {
    recordSheet.classList.remove("open");
    filtersSheet.classList.remove("open");
    map.flyTo({ center: DEFAULT_CENTER, zoom: DEFAULT_ZOOM, duration: 800 });
}

map.on("click", (e) => {
    const hits = map.queryRenderedFeatures(e.point, { layers: ["cemeteries-layer"] });
    if (!hits.length) exitCemeteryMode();
});

// ============================================================
// MAP LOAD
// ============================================================
map.on("load", () => {
    registerGraveSymbols();
    registerAccessMarks();

    Papa.parse("cemlist.csv", {
        download: true, header: true, skipEmptyLines: true,
        complete: function(results) {
            const features = [];
            results.data.forEach(row => {
                const lat = parseFloat(row.LAT), lon = parseFloat(row.LONG);
                if (isNaN(lat) || isNaN(lon)) return;

                features.push({
                    type: "Feature",
                    properties: {
                        Cemetery_ID: row.ID || "",
                        Cemetery_Name: row.NAME || "",
                        Other_Names: row.OTHER_NAMES || "",
                        Township: row.TOWNSHIP || "",
                        Established_Year: parseInt(row.ESTABLISHED || row["EST."], 10) || 0,
                        Grave_Recorded: parseInt(row.GRAVE_RECORDED, 10) || 0,
                        Grave_Estimate: parseInt(row.GRAVES_ESTIMATE, 10) || 0,
                        Access: parseInt(row.ACCESS, 10) || 3,
                        Approximate_Size: row.SIZE || ""
                    },
                    geometry: { type: "Point", coordinates: [lon, lat] }
                });
            });

            map.addSource("cemeteries-data", { type: "geojson", data: { type: "FeatureCollection", features } });
            
            map.addLayer({
                id: "cemeteries-layer", type: "circle", source: "cemeteries-data",
                paint: {
                    "circle-radius": 10,
                    "circle-color": ["match", ["get", "Access"], 0, "#8B0000", 1, "#D2691E", 2, "#C9A227", 3, "#01796F", "#777777"],
                    "circle-stroke-width": 2, "circle-stroke-color": "#ffffff"
                }
            });

            map.addLayer({
                id: "cemeteries-marks-layer", type: "symbol", source: "cemeteries-data", filter: ACCESS_MARK_FILTER,
                layout: {
                    "icon-image": ["match", ["get", "Access"], 0, "access-mark-inaccessible", 1, "access-mark-private", "access-mark-permission"],
                    "icon-size": 0.49, "icon-allow-overlap": true, "icon-ignore-placement": true
                }
            });

            map.on("click", "cemeteries-layer", (e) => {
                if (!e.features.length) return;
                const props = e.features[0].properties;
                map.flyTo({ center: e.features[0].geometry.coordinates, zoom: 16, duration: 1000 });

                recordContent.innerHTML = `
                    <div class="preview-header">
                        <div>
                            <h2 class="preview-title">${props.Cemetery_Name || "Unnamed Cemetery"}</h2>
                            <div style="font-size: 13px; color: #666;">${props.Other_Names ? "Alt: " + props.Other_Names : "Township: " + (props.Township || "N/A")}</div>
                        </div>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-box"><div class="stat-val">${props.Established_Year > 0 ? props.Established_Year : "N/A"}</div><div class="stat-lbl">Established</div></div>
                        <div class="stat-box"><div class="stat-val">${props.Grave_Recorded >= 0 ? props.Grave_Recorded : "0"}</div><div class="stat-lbl">Recorded Graves</div></div>
                    </div>
                    <button class="see-more-btn" onclick="openFullRecord('${props.Cemetery_ID}')">SEE MORE / FULL RECORDS →</button>
                `;
                recordSheet.classList.add("open");
            });

            map.on("mouseenter", "cemeteries-layer", () => map.getCanvas().style.cursor = "pointer");
            map.on("mouseleave", "cemeteries-layer", () => map.getCanvas().style.cursor = "");
        }
    });
});

window.openFullRecord = function(cemeteryID) {
    cemeteryLightboxFrame.src = "cemetery.html?id=" + encodeURIComponent(cemeteryID);
    cemeteryLightbox.style.display = "flex";
};

document.getElementById("close-cemetery-lightbox").addEventListener("click", () => {
    cemeteryLightbox.style.display = "none"; cemeteryLightboxFrame.src = "";
});
</script>
</body>
</html>
