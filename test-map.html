<script>


// ============================================================
// TEST CEMETERY SETTINGS
// ============================================================

const TEST_CEMETERY_ID =
    "TEST001";


const TEST_CEMETERY_NAME =
    "Test Cemetery";


const TEST_CENTER = [

    -85.0453363700569,

    39.4242482968472

];


// ============================================================
// 100 SQUARE FOOT CEMETERY
//
// 10 ft × 10 ft
//
// Coordinates are generated approximately from the
// center point above.
// ============================================================

const TEST_CEMETERY_HALF_SIZE_METERS =
    1.524;


// ============================================================
// MAP SETTINGS
// ============================================================

const INITIAL_CENTER = [

    -85.0626,

    39.3992

];


const INITIAL_ZOOM =
    11;


const TEST_CEMETERY_ZOOM =
    18;


// ============================================================
// MAP
// ============================================================

const map =
    new maplibregl.Map({

        container:
            "map",

        style: {

            version:
                8,

            sources: {

                "osm-tiles": {

                    type:
                        "raster",

                    tiles: [

                        "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

                    ],

                    tileSize:
                        256,

                    attribution:
                        "© OpenStreetMap contributors"

                }

            },

            layers: [

                {

                    id:
                        "osm-layer",

                    type:
                        "raster",

                    source:
                        "osm-tiles"

                }

            ]

        },

        center:
            INITIAL_CENTER,

        zoom:
            INITIAL_ZOOM,

        maxBounds: [

            [-85.50, 39.10],

            [-84.65, 39.70]

        ],

        maxZoom:
            20

    });


// ============================================================
// DOM REFERENCES
// ============================================================

const infoPanel =
    document.getElementById(
        "info-panel"
    );


const infoContent =
    document.getElementById(
        "info-content"
    );


const cemeteryMode =
    document.getElementById(
        "cemetery-mode"
    );


const backToMap =
    document.getElementById(
        "back-to-map"
    );


const searchBox =
    document.getElementById(
        "search"
    );


const clearSearch =
    document.getElementById(
        "clear-search"
    );


const searchResults =
    document.getElementById(
        "search-results"
    );


const resetButton =
    document.getElementById(
        "reset-btn"
    );


const closeInfo =
    document.getElementById(
        "close-info"
    );


// ============================================================
// STATE
// ============================================================

let inCemeteryMode =
    false;


let testInterments =
    [];


// ============================================================
// SHOW DEFAULT INFORMATION
// ============================================================

function showDefaultInfo() {

    infoContent.innerHTML = `

        <div class="placeholder">

            Click the Test Cemetery marker
            to enter the cemetery map.

        </div>

    `;

}


// ============================================================
// CREATE 100-SQUARE-FOOT POLYGON
//
// The center point is TEST_CENTER.
//
// 10 ft = 3.048 meters.
// Half = 1.524 meters.
//
// Approximate conversion:
//
// latitude:
// 1 degree ≈ 111,320 meters
//
// longitude:
// 1 degree ≈ 111,320 × cos(latitude)
// ============================================================

function createTestBoundary() {

    const lat =
        TEST_CENTER[1];


    const lon =
        TEST_CENTER[0];


    const metersPerLatitudeDegree =
        111320;


    const metersPerLongitudeDegree =
        111320 *
        Math.cos(
            lat *
            Math.PI /
            180
        );


    const latOffset =
        TEST_CEMETERY_HALF_SIZE_METERS /
        metersPerLatitudeDegree;


    const lonOffset =
        TEST_CEMETERY_HALF_SIZE_METERS /
        metersPerLongitudeDegree;


    return [

        [
            lon - lonOffset,
            lat - latOffset
        ],

        [
            lon + lonOffset,
            lat - latOffset
        ],

        [
            lon + lonOffset,
            lat + latOffset
        ],

        [
            lon - lonOffset,
            lat + latOffset
        ],

        [
            lon - lonOffset,
            lat - latOffset
        ]

    ];

}


// ============================================================
// CREATE FALLBACK GRAVE LOCATIONS
//
// These are used only if TEST001 rows with valid LAT/LONG
// coordinates are not found in interments.csv.
//
// Ten graves arranged in two rows of five.
// ============================================================

function createFallbackGraves() {

    const lat =
        TEST_CENTER[1];


    const lon =
        TEST_CENTER[0];


    const metersPerLatitudeDegree =
        111320;


    const metersPerLongitudeDegree =
        111320 *
        Math.cos(
            lat *
            Math.PI /
            180
        );


    const graveSpacingX =
        0.45;


    const graveSpacingY =
        0.75;


    const graves =
        [];


    for (
        let row = 0;
        row < 2;
        row++
    ) {

        for (
            let column = 0;
            column < 5;
            column++
        ) {

            const x =
                (
                    column -
                    2
                ) *
                graveSpacingX;


            const y =
                (
                    row -
                    0.5
                ) *
                graveSpacingY;


            graves.push({

                id:
                    "TEST-GRAVE-" +
                    (
                        graves.length +
                        1
                    ),


                firstName:
                    "Test",

                lastName:
                    "Person " +
                    (
                        graves.length +
                        1
                    ),


                veteran:
                    graves.length === 0
                        ? "1"
                        : "0",


                lat:
                    lat +
                    (
                        y /
                        metersPerLatitudeDegree
                    ),


                lon:
                    lon +
                    (
                        x /
                        metersPerLongitudeDegree
                    )

            });

        }

    }


    return graves;

}


// ============================================================
// LOAD INTERMENTS
// ============================================================

function loadTestInterments() {

    Papa.parse(

        "interments.csv",

        {

            download:
                true,

            header:
                true,

            skipEmptyLines:
                true,


            complete:
                function (
                    results
                ) {


                    const rows =
                        results.data.filter(
                            function (row) {

                                return String(
                                    row.CEMETERY_ID ||
                                    ""
                                )
                                    .trim()
                                    .toUpperCase() ===
                                    TEST_CEMETERY_ID;

                            }
                        );


                    const validRows =
                        [];


                    rows.forEach(
                        function (row) {

                            const lat =
                                parseFloat(
                                    row.LAT
                                );


                            const lon =
                                parseFloat(
                                    row.LONG
                                );


                            if (
                                !isNaN(lat) &&
                                !isNaN(lon)
                            ) {

                                validRows.push({

                                    row:
                                        row,

                                    lat:
                                        lat,

                                    lon:
                                        lon

                                });

                            }

                        }
                    );


                    if (
                        validRows.length > 0
                    ) {

                        testInterments =
                            validRows;

                    }

                    else {

                        console.warn(
                            "No TEST001 grave coordinates found. Using generated test graves."
                        );


                        testInterments =
                            createFallbackGraves().map(
                                function (grave) {

                                    return {

                                        row: {

                                            CEMETERY_ID:
                                                TEST_CEMETERY_ID,

                                            "FIRST NAME":
                                                grave.firstName,

                                            "LAST NAME":
                                                grave.lastName,

                                            VETERAN:
                                                grave.veteran

                                        },

                                        lat:
                                            grave.lat,

                                        lon:
                                            grave.lon

                                    };

                                }
                            );

                    }


                    buildCemeteryMode();

                },


            error:
                function (error) {

                    console.error(
                        "interments.csv loading error:",
                        error
                    );


                    testInterments =
                        createFallbackGraves().map(
                            function (grave) {

                                return {

                                    row: {

                                        CEMETERY_ID:
                                            TEST_CEMETERY_ID,

                                        "FIRST NAME":
                                            grave.firstName,

                                        "LAST NAME":
                                            grave.lastName,

                                        VETERAN:
                                            grave.veteran

                                    },

                                    lat:
                                        grave.lat,

                                    lon:
                                        grave.lon

                                };

                            }
                        );


                    buildCemeteryMode();

                }

        }

    );

}


// ============================================================
// BUILD TEST CEMETERY
// ============================================================

function buildCemeteryMode() {


    // ========================================================
    // TEST CEMETERY SOURCE
    // ========================================================

    map.addSource(

        "test-cemetery-boundary",

        {

            type:
                "geojson",

            data: {

                type:
                    "Feature",

                properties: {

                    ID:
                        TEST_CEMETERY_ID,

                    NAME:
                        TEST_CEMETERY_NAME

                },

                geometry: {

                    type:
                        "Polygon",

                    coordinates: [

                        createTestBoundary()

                    ]

                }

            }

        }

    );


    // ========================================================
    // BOUNDARY FILL
    // ========================================================

    map.addLayer({

        id:
            "test-cemetery-fill",

        type:
            "fill",

        source:
            "test-cemetery-boundary",

        layout: {

            visibility:
                "none"

        },

        paint: {

            "fill-color":
                "#C9A227",

            "fill-opacity":
                0.18

        }

    });


    // ========================================================
    // BOUNDARY LINE
    // ========================================================

    map.addLayer({

        id:
            "test-cemetery-boundary-line",

        type:
            "line",

        source:
            "test-cemetery-boundary",

        layout: {

            visibility:
                "none"

        },

        paint: {

            "line-color":
                "#463a2d",

            "line-width":
                3,

            "line-opacity":
                0.9

        }

    });


    // ========================================================
    // TEST CEMETERY MARKER
    // ========================================================

    const cemeteryMarker =
        document.createElement(
            "div"
        );


    cemeteryMarker.style.width =
        "28px";


    cemeteryMarker.style.height =
        "28px";


    cemeteryMarker.style.borderRadius =
        "50%";


    cemeteryMarker.style.background =
        "#01796F";


    cemeteryMarker.style.border =
        "3px solid white";


    cemeteryMarker.style.boxShadow =
        "0 1px 6px rgba(0,0,0,0.45)";


    cemeteryMarker.style.cursor =
        "pointer";


    cemeteryMarker.title =
        TEST_CEMETERY_NAME;


    const marker =
        new maplibregl.Marker({

            element:
                cemeteryMarker,

            anchor:
                "center"

        })

            .setLngLat(
                TEST_CENTER
            )

            .addTo(map);


    cemeteryMarker.addEventListener(

        "click",

        function (event) {

            event.stopPropagation();

            enterCemeteryMode();

        }

    );


    // ========================================================
    // CEMETERY LABEL
    // ========================================================

    const labelElement =
        document.createElement(
            "div"
        );


    labelElement.className =
        "test-label";


    labelElement.textContent =
        TEST_CEMETERY_NAME;


    const labelMarker =
        new maplibregl.Marker({

            element:
                labelElement,

            anchor:
                "bottom",

            offset:
                [0, -18]

        })

            .setLngLat(
                TEST_CENTER
            )

            .addTo(map);


    // ========================================================
    // STORE REFERENCES
    // ========================================================

    window.testCemeteryMarker =
        marker;


    window.testCemeteryLabel =
        labelMarker;


    // ========================================================
    // PROCESS SEARCH
    // ========================================================

    updateSearchResults();

}


// ============================================================
// ENTER CEMETERY MODE
// ============================================================

function enterCemeteryMode() {


    if (
        inCemeteryMode
    ) {

        return;

    }


    inCemeteryMode =
        true;


    // ========================================================
    // HIDE CEMETERY MARKER AND LABEL
    // ========================================================

    if (
        window.testCemeteryMarker
    ) {

        window.testCemeteryMarker.remove();

    }


    if (
        window.testCemeteryLabel
    ) {

        window.testCemeteryLabel.remove();

    }


    // ========================================================
    // SHOW BOUNDARY
    // ========================================================

    map.setLayoutProperty(

        "test-cemetery-fill",

        "visibility",

        "visible"

    );


    map.setLayoutProperty(

        "test-cemetery-boundary-line",

        "visibility",

        "visible"

    );


    // ========================================================
    // BUILD GRAVE MARKERS
    // ========================================================

    testInterments.forEach(

        function (
            grave,
            index
        ) {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "grave-marker";


            element.title =
                getGraveName(
                    grave.row,
                    index
                );


            const graveMarker =
                new maplibregl.Marker({

                    element:
                        element,

                    anchor:
                        "center"

                })

                    .setLngLat([

                        grave.lon,

                        grave.lat

                    ])

                    .addTo(map);


            element.addEventListener(

                "click",

                function (event) {

                    event.stopPropagation();

                    showGraveInfo(
                        grave,
                        index
                    );

                }

            );


            grave.marker =
                graveMarker;

        }

    );


    // ========================================================
    // SHOW CEMETERY MODE CONTROL
    // ========================================================

    cemeteryMode.style.display =
        "block";


    // ========================================================
    // FLY TO CEMETERY
    // ========================================================

    map.flyTo({

        center:
            TEST_CENTER,

        zoom:
            TEST_CEMETERY_ZOOM,

        duration:
            900

    });


    // ========================================================
    // SHOW CEMETERY INFORMATION
    // ========================================================

    infoPanel.style.display =
        "block";


    infoContent.innerHTML = `

        <h2>
            ${TEST_CEMETERY_NAME}
        </h2>

        <p>
            Test cemetery view.
        </p>

        <h3>
            Survey Area
        </h3>

        <div class="popup-field">

            <span class="popup-label">
                Area:
            </span>

            <span>
                100 square feet
            </span>

        </div>

        <div class="popup-field">

            <span class="popup-label">
                Dimensions:
            </span>

            <span>
                10 ft × 10 ft
            </span>

        </div>

        <div class="popup-field">

            <span class="popup-label">
                Graves:
            </span>

            <span>
                ${testInterments.length}
            </span>

        </div>

        <p style="margin-top:12px;">
            Click an individual grave
            marker to inspect its record.
        </p>

    `;

}


// ============================================================
// GET GRAVE NAME
// ============================================================

function getGraveName(
    row,
    index
) {

    const firstName =
        String(
            row["FIRST NAME"] ||
            ""
        ).trim();


    const lastName =
        String(
            row["LAST NAME"] ||
            ""
        ).trim();


    const name =
        (
            firstName +
            " " +
            lastName
        ).trim();


    return name ||
        "Test Grave " +
        (
            index +
            1
        );

}


// ============================================================
// SHOW GRAVE INFORMATION
// ============================================================

function showGraveInfo(
    grave,
    index
) {

    const row =
        grave.row;


    const name =
        getGraveName(
            row,
            index
        );


    const veteran =
        String(
            row.VETERAN ||
            ""
        ).trim();


    const veteranText =
        veteran === "1"
            ? "Yes"
            : veteran === "0"
                ? "No"
                : "Unknown";


    infoPanel.style.display =
        "block";


    infoContent.innerHTML = `

        <h2>
            ${escapeHTML(name)}
        </h2>


        <h3>
            Cemetery
        </h3>


        <p>
            ${TEST_CEMETERY_NAME}
        </p>


        <h3>
            Grave Location
        </h3>


        <div class="popup-field">

            <span class="popup-label">
                Latitude:
            </span>

            <span>
                ${grave.lat}
            </span>

        </div>


        <div class="popup-field">

            <span class="popup-label">
                Longitude:
            </span>

            <span>
                ${grave.lon}
            </span>

        </div>


        <h3>
            Interment Record
        </h3>


        <div class="popup-field">

            <span class="popup-label">
                Veteran:
            </span>

            <span>
                ${veteranText}
            </span>

        </div>


        <div class="popup-field">

            <span class="popup-label">
                Cemetery ID:
            </span>

            <span>
                ${escapeHTML(
                    row.CEMETERY_ID ||
                    TEST_CEMETERY_ID
                )}
            </span>

        </div>


        <p style="margin-top:12px;">

            This is a test grave marker.
            Additional fields from the
            interments record can be added
            here later.

        </p>

    `;

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ============================================================
// EXIT CEMETERY MODE
// ============================================================

function exitCemeteryMode() {


    if (
        !inCemeteryMode
    ) {

        return;

    }


    inCemeteryMode =
        false;


    // ========================================================
    // REMOVE GRAVE MARKERS
    // ========================================================

    testInterments.forEach(

        function (grave) {

            if (
                grave.marker
            ) {

                grave.marker.remove();

                grave.marker =
                    null;

            }

        }

    );


    // ========================================================
    // HIDE CEMETERY BOUNDARY
    // ========================================================

    map.setLayoutProperty(

        "test-cemetery-fill",

        "visibility",

        "none"

    );


    map.setLayoutProperty(

        "test-cemetery-boundary-line",

        "visibility",

        "none"

    );


    // ========================================================
    // RESTORE CEMETERY MARKER
    // ========================================================

    if (
        window.testCemeteryMarker
    ) {

        window.testCemeteryMarker.addTo(
            map
        );

    }


    if (
        window.testCemeteryLabel
    ) {

        window.testCemeteryLabel.addTo(
            map
        );

    }


    // ========================================================
    // HIDE CEMETERY MODE CONTROL
    // ========================================================

    cemeteryMode.style.display =
        "none";


    // ========================================================
    // RESTORE INFORMATION PANEL
    // ========================================================

    showDefaultInfo();


    // ========================================================
    // RETURN TO COUNTY VIEW
    // ========================================================

    map.flyTo({

        center:
            INITIAL_CENTER,

        zoom:
            INITIAL_ZOOM,

        duration:
            900

    });

}


// ============================================================
// BACK BUTTON
// ============================================================

backToMap.addEventListener(

    "click",

    function () {

        exitCemeteryMode();

    }

);


// ============================================================
// CLOSE INFORMATION PANEL
// ============================================================

closeInfo.addEventListener(

    "click",

    function () {

        infoPanel.style.display =
            "none";

    }

);


// ============================================================
// SEARCH
// ============================================================

searchBox.addEventListener(

    "input",

    updateSearchResults

);


clearSearch.addEventListener(

    "click",

    function () {

        searchBox.value =
            "";

        updateSearchResults();

        searchBox.focus();

    }

);


// ============================================================
// SIMPLE TEST SEARCH
// ============================================================

function updateSearchResults() {

    const search =
        searchBox.value
            .trim()
            .toLowerCase();


    if (
        search === ""
    ) {

        searchResults.textContent =
            "";

        clearSearch.style.display =
            "none";

        return;

    }


    clearSearch.style.display =
        "block";


    const cemeteryMatch =
        TEST_CEMETERY_NAME
            .toLowerCase()
            .includes(
                search
            );


    const peopleMatches =
        testInterments.filter(

            function (grave) {

                return getGraveName(
                    grave.row,
                    0
                )
                    .toLowerCase()
                    .includes(
                        search
                    );

            }

        ).length;


    searchResults.textContent =

        (
            cemeteryMatch
                ? "1 cemetery match"
                : "0 cemetery matches"
        ) +

        " · " +

        peopleMatches +

        (
            peopleMatches === 1
                ? " person match"
                : " person matches"
        );

}


// ============================================================
// RESET
// ============================================================

resetButton.addEventListener(

    "click",

    function () {

        searchBox.value =
            "";

        updateSearchResults();


        if (
            inCemeteryMode
        ) {

            exitCemeteryMode();

        }

        else {

            map.flyTo({

                center:
                    INITIAL_CENTER,

                zoom:
                    INITIAL_ZOOM,

                duration:
                    500

            });

            showDefaultInfo();

        }

    }

);


// ============================================================
// MAP LOAD
// ============================================================

map.on(

    "load",

    function () {


        // ====================================================
        // NAVIGATION CONTROL
        // ====================================================

        map.addControl(

            new maplibregl.NavigationControl({

                showCompass:
                    false

            }),

            "top-right"

        );


        // ====================================================
        // FRANKLIN COUNTY BOUNDARY
        // ====================================================

        map.addSource(

            "franklin-county",

            {

                type:
                    "geojson",

                data:
                    "franklin-county.geojson"

            }

        );


        map.addLayer({

            id:
                "franklin-county-outline",

            type:
                "line",

            source:
                "franklin-county",

            paint: {

                "line-color":
                    "#555555",

                "line-width":
                    1.5,

                "line-opacity":
                    0.8,

                "line-dasharray":
                    [
                        2,
                        2
                    ]

            }

        });


        // ====================================================
        // LOAD TEST CEMETERY
        // ====================================================

        loadTestInterments();

    }

);

</script>
