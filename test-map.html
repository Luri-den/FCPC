<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Franklin County Indiana Pioneer Cemeteries Archive Prototype
</title>


<!-- =========================================================
     MAPLIBRE
     ========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<script
    src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
></script>


<!-- =========================================================
     PAPAPARSE
     ========================================================= -->

<script
    src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"
></script>


<!-- =========================================================
     STYLE
     ========================================================= -->

<style>

    * {
        box-sizing: border-box;
    }


    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
    }


    body {
        display: flex;
        flex-direction: column;
        background: #f4f1e8;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {
        background: #01796F;
        color: white;
        padding: 14px 18px;
        z-index: 10;
    }


    header h1 {
        margin: 0 0 5px 0;
        font-size: 22px;
    }


    header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
    }


    /* =====================================================
       CONTROLS
       ===================================================== */

    #controls {
        background: #eee9dc;
        border-bottom: 1px solid #c9c1b2;
        padding: 10px;

        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;

        z-index: 5;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    #search-wrapper {
        position: relative;

        flex: 1 1 220px;
        min-width: 180px;
    }


    #search {
        width: 100%;

        padding: 9px 34px 9px 10px;

        border: 1px solid #aaa;
        border-radius: 4px;

        font-size: 15px;
    }


    #clear-search {
        position: absolute;

        top: 50%;
        right: 5px;

        transform: translateY(-50%);

        width: 26px;
        height: 26px;

        padding: 0;

        border: none;
        border-radius: 50%;

        background: transparent;
        color: #777;

        font-size: 20px;
        line-height: 26px;

        cursor: pointer;

        display: none;
    }


    #clear-search:hover {
        background: #e5e0d5;
        color: #333;
    }


    /* =====================================================
       SEARCH TOGGLES
       ===================================================== */

    #search-toggles {
        display: flex;
        gap: 4px;
        align-items: center;
    }


    .search-toggle {
        padding: 8px 11px;

        border: 1px solid #aaa;
        border-radius: 4px;

        background: #ddd8cc;
        color: #463a2d;

        font-size: 13px;
        font-weight: normal;

        cursor: pointer;
    }


    .search-toggle:hover {
        background: #cfc8bb;
    }


    .search-toggle.active {
        background: #01796F;
        border-color: #01796F;
        color: white;
    }


    .search-toggle.active:hover {
        background: #463a2d;
        border-color: #463a2d;
    }


    /* =====================================================
       YEAR FILTER
       ===================================================== */

    #year-filter-container {
        display: flex;
        align-items: center;
        gap: 8px;

        padding: 0 4px;
    }


    #year-filter-label {
        font-size: 14px;
        white-space: nowrap;
        color: #3f3528;
    }


    #year-filter {
        width: 150px;
        cursor: pointer;
    }


    #year-value {
        min-width: 42px;

        font-weight: bold;
        font-size: 14px;

        color: #3f3528;

        text-align: center;
    }


    /* =====================================================
       GENERAL BUTTONS
       ===================================================== */

    button {
        padding: 9px 14px;

        border: 1px solid #8d8375;
        border-radius: 4px;

        background: #01796F;
        color: white;

        font-size: 14px;

        cursor: pointer;
    }


    button:hover {
        background: #463a2d;
    }


    /* =====================================================
       SEE MORE BUTTON
       ===================================================== */

    .see-more-button {
        display: block;

        width: 100%;

        padding: 10px 14px;

        border: 1px solid #8d8375;
        border-radius: 4px;

        background: #01796F;
        color: white;

        font-size: 14px;
        font-weight: bold;

        text-align: center;

        cursor: pointer;
    }


    .see-more-button:hover {
        background: #463a2d;
    }


    /* =====================================================
       CEMETERY POPUP PHOTO
       ===================================================== */

    .cemetery-popup-photo {
        display: block;

        width: 100%;
        height: auto;

        max-height: 220px;

        object-fit: contain;

        margin: 0 0 12px 0;

        border-radius: 4px;
    }


    /* =====================================================
       POPUP LABEL / VALUE FIELDS
       ===================================================== */

    .popup-field {
        display: grid;

        grid-template-columns: 130px 1fr;

        column-gap: 10px;

        margin-bottom: 8px;
    }


    .popup-label {
        font-weight: bold;
    }


    /* =====================================================
       HISTORICAL CEMETERY LIST
       ===================================================== */

    .lake-cemetery {
        border-top: 1px solid #ddd;

        padding: 12px 0;
    }


    .lake-cemetery:first-child {
        border-top: none;
    }


    .lake-cemetery h3 {
        margin: 0 0 10px 0;

        font-size: 16px;

        color: #463a2d;
    }


    .lake-introduction {
        margin: 0 0 12px 0;

        line-height: 1.4;
        font-size: 14px;
    }


    /* =====================================================
       MAP
       ===================================================== */

    #map {
        flex: 1;

        min-height: 0;

        width: 100%;

        position: relative;
    }


    /* =====================================================
       INFO PANEL
       ===================================================== */

    #info-panel {
        position: absolute;

        top: 10px;
        right: 10px;

        width: 310px;

        max-width: calc(100% - 20px);
        max-height: calc(100% - 20px);

        overflow-y: auto;

        background: rgba(255, 255, 255, 0.96);

        border: 1px solid #aaa;
        border-radius: 5px;

        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.25);

        padding: 14px;

        z-index: 4;
    }


    #close-info {
        position: absolute;

        top: 5px;
        right: 7px;

        width: 28px;
        height: 28px;

        padding: 0;

        border: none;
        border-radius: 50%;

        background: transparent;

        color: #5a4b3a;

        font-size: 23px;
        line-height: 28px;

        cursor: pointer;
    }


    #close-info:hover {
        background: #e5e0d5;
        color: #2f281f;
    }


    #info-content {
        padding-right: 24px;
    }


    #info-panel h2 {
        margin: 0 0 6px 0;

        font-size: 20px;

        color: #3f3528;
    }


    #info-panel h3 {
        margin: 12px 0 3px 0;

        font-size: 13px;

        color: #6b6258;

        text-transform: uppercase;
    }


    #info-panel p {
        margin: 0;

        line-height: 1.4;

        font-size: 14px;
    }


    .placeholder {
        color: #666;

        font-size: 14px;

        line-height: 1.4;
    }


    .error-message {
        color: #8b0000;

        font-size: 14px;

        line-height: 1.45;
    }


    /* =====================================================
       CEMETERY LIGHTBOX
       ===================================================== */

    #cemetery-lightbox {
        display: none;

        position: absolute;

        inset: 0;

        background: rgba(0, 0, 0, 0.78);

        z-index: 20;

        align-items: center;
        justify-content: center;

        padding: 20px;
    }


    #cemetery-lightbox-frame {
        width: min(1100px, 95%);
        height: min(850px, 92%);

        border: none;

        border-radius: 5px;

        background: white;

        box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.4);
    }


    #close-cemetery-lightbox {
        position: absolute;

        top: 15px;
        right: 20px;

        width: 38px;
        height: 38px;

        padding: 0;

        border: none;
        border-radius: 50%;

        background: rgba(255, 255, 255, 0.92);

        color: #3f3528;

        font-size: 28px;
        line-height: 38px;

        cursor: pointer;

        z-index: 21;
    }


    #close-cemetery-lightbox:hover {
        background: white;
        color: #01796F;
    }


    /* =====================================================
       MAP HOVER LABELS
       ===================================================== */

    .map-hover-popup .maplibregl-popup-content {
        padding: 6px 9px;

        border: 1px solid rgba(90, 75, 58, 0.55);
        border-radius: 14px;

        background: rgba(255, 255, 255, 0.96);

        box-shadow:
            0 2px 7px rgba(0, 0, 0, 0.25);

        color: #3f3528;

        font-size: 12px;
        font-weight: bold;
        line-height: 1.15;

        white-space: nowrap;
    }


    .map-hover-popup .maplibregl-popup-tip {
        border-top-color: rgba(255, 255, 255, 0.96);
        border-bottom-color: rgba(255, 255, 255, 0.96);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

        header {
            padding: 11px 13px;
        }


        header h1 {
            font-size: 18px;
        }


        header p {
            font-size: 12px;
        }


        #controls {
            padding: 8px;
        }


        #search,
        #controls > button {
            width: 100%;
            flex: 1 1 100%;
        }


        #search-toggles {
            width: 100%;
            flex: 1 1 100%;
        }


        .search-toggle {
            flex: 1;
        }


        #year-filter-container {
            width: 100%;
            flex: 1 1 100%;
        }


        #year-filter {
            flex: 1;
            width: auto;
        }


        #info-panel {
            position: absolute;

            top: auto;
            right: 8px;
            bottom: 8px;
            left: 8px;

            width: auto;

            max-width: none;
            max-height: 65%;
        }


        .popup-field {
            grid-template-columns: 120px 1fr;
        }


        #cemetery-lightbox {
            padding: 10px;
        }


        #cemetery-lightbox-frame {
            width: 100%;
            height: 90%;
        }


        #close-cemetery-lightbox {
            top: 5px;
            right: 8px;
        }

    }

</style>

</head>

<body>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header>

    <h1>
        Franklin County Indiana Pioneer Cemeteries Archive Prototype
    </h1>

    <p>
        Historic Cemetery Locations and Associated Records
    </p>

</header>


<!-- =========================================================
     CONTROLS
     ========================================================= -->

<div id="controls">


    <!-- =====================================================
         SEARCH
         ===================================================== -->

    <div id="search-wrapper">

        <input
            type="text"
            id="search"
            placeholder="Search cemeteries or people..."
        >


        <button
            id="clear-search"
            type="button"
            title="Clear search"
        >
            &times;
        </button>

    </div>


    <!-- =====================================================
         SEARCH TOGGLES
         ===================================================== -->

    <div id="search-toggles">

        <button
            type="button"
            class="search-toggle active"
            id="search-cemetery"
        >
            Cemetery
        </button>


        <button
            type="button"
            class="search-toggle active"
            id="search-person"
        >
            Person
        </button>


        <button
            type="button"
            class="search-toggle"
            id="search-veterans"
        >
            Veterans Only
        </button>

    </div>


    <!-- =====================================================
         YEAR FILTER
         ===================================================== -->

    <div id="year-filter-container">

        <span id="year-filter-label">
            Established Before:
        </span>


        <input
            type="range"
            id="year-filter"
            min="1800"
            max="1900"
            step="5"
            value="1900"
        >


        <span id="year-value">
            All
        </span>

    </div>


    <!-- =====================================================
         RESET
         ===================================================== -->

    <button id="reset-btn">
        Reset Filters
    </button>

</div>


<!-- =========================================================
     MAP
     ========================================================= -->

<div id="map">


    <!-- =====================================================
         FLOATING INFORMATION PANEL
         ===================================================== -->

    <div id="info-panel">


        <button
            id="close-info"
            title="Close Panel"
        >
            &times;
        </button>


        <div id="info-content">

            <div class="placeholder">

                Click a cemetery marker on the map
                to inspect historic records and notes.

            </div>

        </div>

    </div>


    <!-- =====================================================
         CEMETERY PAGE LIGHTBOX
         ===================================================== -->

    <div id="cemetery-lightbox">


        <button
            id="close-cemetery-lightbox"
            title="Close Cemetery Record"
        >
            &times;
        </button>


        <iframe
            id="cemetery-lightbox-frame"
            title="Cemetery Record"
        ></iframe>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>


    // ========================================================
    // MAP SETUP
    // ========================================================

    const map =
        new maplibregl.Map({

            container: "map",

            style: {

                version: 8,

                sources: {

                    "osm-tiles": {

                        type: "raster",

                        tiles: [
                            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                        ],

                        tileSize: 256,

                        attribution:
                            "© OpenStreetMap contributors"

                    }

                },

                layers: [

                    {

                        id: "osm-layer",

                        type: "raster",

                        source: "osm-tiles"

                    }

                ]

            },

            zoom: 11,

            center: [
                -85.0626,
                39.3992
            ],

            maxBounds: [
                [-85.50, 39.10],
                [-84.65, 39.70]
            ],

            maxZoom: 30

        });


    // ========================================================
    // DOM REFERENCES
    // ========================================================

    const infoPanel =
        document.getElementById("info-panel");


    const infoContent =
        document.getElementById("info-content");


    const searchBox =
        document.getElementById("search");


    const clearSearch =
        document.getElementById("clear-search");


    const cemeteryToggle =
        document.getElementById("search-cemetery");


    const personToggle =
        document.getElementById("search-person");


    const veteransToggle =
        document.getElementById("search-veterans");


    const yearSlider =
        document.getElementById("year-filter");


    const yearVal =
        document.getElementById("year-value");


    const resetButton =
        document.getElementById("reset-btn");


    const cemeteryLightbox =
        document.getElementById(
            "cemetery-lightbox"
        );


    const cemeteryLightboxFrame =
        document.getElementById(
            "cemetery-lightbox-frame"
        );


    const closeCemeteryLightbox =
        document.getElementById(
            "close-cemetery-lightbox"
        );


    // ========================================================
    // APPLICATION STATE
    // ========================================================

    let cemeteryFeatures = [];

    let intermentsByCemetery = {};

    let intermentsLoaded = false;

    // ========================================================
    // TEST CEMETERY BOUNDARY
    //
    // test-cemetery.geojson contains the test polygon under
    // CEMETERY_ID = TEST001.  That polygon represents the
    // real cemetery whose cemlist.csv ID is FC0202.
    // ========================================================

    const TEST_BOUNDARY_CEMETERY_ID = "FC0202";
    const TEST_BOUNDARY_FILE = "test-cemetery.geojson";

    let testBoundaryData = null;

    let selectedCemeteryFeature = null;

    let hoverPopup = null;

    let searchCemetery = true;

    let searchPerson = true;

    let veteransOnly = false;


    // ========================================================
    // DEFAULT INFORMATION PANEL
    // ========================================================

    function showDefaultInfo() {

        infoContent.innerHTML = `

            <div class="placeholder">

                Click a cemetery marker
                on the map to inspect
                historic records and notes.

            </div>

        `;

    }


    // ========================================================
    // CLOSE INFORMATION PANEL
    // ========================================================

    document
        .getElementById("close-info")
        .addEventListener(
            "click",
            function () {

                infoPanel.style.display = "none";

            }
        );


    // ========================================================
    // CLOSE CEMETERY LIGHTBOX
    // ========================================================

    function closeCemeteryRecord() {

        cemeteryLightbox.style.display = "none";

        cemeteryLightboxFrame.src = "";

    }


    closeCemeteryLightbox.addEventListener(
        "click",
        closeCemeteryRecord
    );


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                cemeteryLightbox.style.display === "flex"
            ) {

                closeCemeteryRecord();

            }

        }
    );


    // ========================================================
    // SEE MORE BUTTON
    //
    // EVENT DELEGATION IS USED SO THIS CONTINUES TO WORK
    // EVEN THOUGH THE INFO PANEL CONTENT IS REBUILT.
    // ========================================================

    infoContent.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    ".see-more-button"
                );


            if (!button) {
                return;
            }


            const cemeteryID =
                button.dataset.cemeteryId;


            cemeteryLightboxFrame.src =
                "cemetery.html?id=" +
                encodeURIComponent(
                    cemeteryID
                );


            cemeteryLightbox.style.display =
                "flex";

        }
    );


    // ========================================================
    // MAP LOAD
    // ========================================================

    map.on(
        "load",
        function () {


            // =================================================
            // NAVIGATION CONTROL
            // =================================================

            map.addControl(

                new maplibregl.NavigationControl({

                    showCompass: false

                }),

                "top-right"

            );


            // =================================================
            // CSV LOCATIONS
            // =================================================

            const CSV_PATH =
                new URL(
                    "cemlist.csv",
                    document.baseURI
                ).href;


            const LAKE_CSV_PATH =
                new URL(
                    "lakecems.csv",
                    document.baseURI
                ).href;


            const INTERMENTS_CSV_PATH =
                new URL(
                    "interments.csv",
                    document.baseURI
                ).href;


            const TEST_BOUNDARY_PATH =
                new URL(
                    TEST_BOUNDARY_FILE,
                    document.baseURI
                ).href;


            // =================================================
            // LOAD TEST CEMETERY BOUNDARY
            // =================================================

            fetch(TEST_BOUNDARY_PATH)
                .then(function (response) {

                    if (!response.ok) {
                        throw new Error(
                            "Unable to load " +
                            TEST_BOUNDARY_FILE
                        );
                    }

                    return response.json();

                })
                .then(function (data) {

                    testBoundaryData = data;

                    map.addSource(
                        "cemetery-boundaries",
                        {
                            type: "geojson",
                            data: data
                        }
                    );

                    map.addLayer({
                        id: "cemetery-boundary-fill",
                        type: "fill",
                        source: "cemetery-boundaries",
                        layout: {
                            visibility: "none"
                        },
                        paint: {
                            "fill-color": "#01796F",
                            "fill-opacity": 0.10
                        }
                    });

                    map.addLayer({
                        id: "cemetery-boundary-outline",
                        type: "line",
                        source: "cemetery-boundaries",
                        layout: {
                            visibility: "none"
                        },
                        paint: {
                            "line-color": "#01796F",
                            "line-width": 3,
                            "line-opacity": 0.95
                        }
                    });

                    if (selectedCemeteryFeature) {
                        updateCemeteryBoundary();
                    }

                })
                .catch(function (error) {

                    console.error(
                        "test-cemetery.geojson loading error:",
                        error
                    );

                });


            // =================================================
            // LOAD MAIN CEMETERY CSV
            // =================================================

            Papa.parse(
                CSV_PATH,
                {

                    download: true,

                    header: true,

                    skipEmptyLines: true,


                    complete:
                        function (results) {


                            // =================================
                            // STORAGE FOR MAP FEATURES
                            // =================================

                            const mapFeatures = [];


                            // =================================
                            // PROCESS EVERY CSV ROW
                            // =================================

                            results.data.forEach(
                                function (row) {


                                    // -----------------------------
                                    // COORDINATES
                                    // -----------------------------

                                    const lat =
                                        parseFloat(
                                            row.LAT
                                        );


                                    const lon =
                                        parseFloat(
                                            row.LONG
                                        );


                                    // -----------------------------
                                    // GRAVE COUNT
                                    // -----------------------------

                                    const graveCount =
                                        row["COUNT"] === undefined ||
                                        String(
                                            row["COUNT"]
                                        ).trim() === ""
                                            ? -1
                                            : parseInt(
                                                row["COUNT"],
                                                10
                                            );


                                    // -----------------------------
                                    // ACCESSIBILITY
                                    // -----------------------------

                                    const access =
                                        parseInt(
                                            row.ACCESS,
                                            10
                                        );


                                    // -----------------------------
                                    // APPROXIMATE SIZE
                                    // -----------------------------

                                    const approximateSize =
                                        row[
                                            "APPROXIMATE SIZE"
                                        ] || "";


                                    // -----------------------------
                                    // STATUS
                                    // -----------------------------

                                    const status =
                                        parseInt(
                                            row.STATUS,
                                            10
                                        );


                                    // -----------------------------
                                    // VETERANS
                                    // -----------------------------

                                    const vets =
                                        parseInt(
                                            row.VETS,
                                            10
                                        );


                                    // -----------------------------
                                    // ONLY CREATE MARKER
                                    // IF COORDINATES ARE VALID
                                    // -----------------------------

                                    if (
                                        !isNaN(lat) &&
                                        !isNaN(lon)
                                    ) {


                                        mapFeatures.push({

                                            type: "Feature",


                                            properties: {

                                                Cemetery_ID:
                                                    row.ID || "",


                                                Cemetery_Name:
                                                    row.NAME || "",


                                                Other_Names:
                                                    row[
                                                        "OTHER NAMES"
                                                    ] || "",


                                                Township:
                                                    row.TOWNSHIP || "",


                                                Established_Year:
                                                    parseInt(
                                                        row["EST."],
                                                        10
                                                    ) || 0,


                                                Grid_Index:
                                                    row[
                                                        "MAP LOCATION"
                                                    ] || "",


                                                General_Notes:
                                                    row.NOTES || "",


                                                Condition_Notes:
                                                    row.CONDITION || "",


                                                Grave_Count:
                                                    graveCount,


                                                Access:
                                                    isNaN(access)
                                                        ? -1
                                                        : access,


                                                Approximate_Size:
                                                    approximateSize,


                                                Status:
                                                    isNaN(status)
                                                        ? -1
                                                        : status,


                                                Vets:
                                                    isNaN(vets)
                                                        ? -1
                                                        : vets,


                                                Search_Match:
                                                    false,


                                                Search_Active:
                                                    false

                                            },


                                            geometry: {

                                                type: "Point",

                                                coordinates: [
                                                    lon,
                                                    lat
                                                ]

                                            }

                                        });

                                    }

                                }
                            );


                            // =================================
                            // SAVE FEATURES FOR SEARCH
                            // =================================

                            cemeteryFeatures =
                                mapFeatures;


                            // =================================
                            // ADD CEMETERY DATA SOURCE
                            // =================================

                            map.addSource(

                                "cemeteries-data",

                                {

                                    type: "geojson",

                                    data: {

                                        type:
                                            "FeatureCollection",

                                        features:
                                            mapFeatures

                                    }

                                }

                            );


                            // =================================
                            // MAIN CEMETERY MARKER LAYER
                            // =================================

                            map.addLayer({

                                id:
                                    "cemeteries-layer",

                                type:
                                    "circle",

                                source:
                                    "cemeteries-data",

                                paint: {

                                    "circle-radius": [

                                        "case",

                                        [
                                            "<",

    // ========================================================

    function desktopHoverEnabled() {

        return window.matchMedia(
            "(hover: hover) and (pointer: fine)"
        ).matches;

    }


    function escapeHtml(value) {

        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function showHoverLabel(text, coordinates) {

        if (!desktopHoverEnabled()) {
            return;
        }

        if (!text) {
            return;
        }

        if (!hoverPopup) {

            hoverPopup = new maplibregl.Popup({
                closeButton: false,
                closeOnClick: false,
                offset: 12,
                className: "map-hover-popup"
            });

        }

        hoverPopup
            .setLngLat(coordinates)
            .setHTML(escapeHtml(text))
            .addTo(map);

    }


    function removeHoverLabel() {

        if (hoverPopup) {
            hoverPopup.remove();
        }

    }


    // ========================================================
    // TEST CEMETERY BOUNDARY
    // ========================================================

    function updateCemeteryBoundary() {

        const visible =
            selectedCemeteryFeature &&
            String(
                selectedCemeteryFeature.properties.Cemetery_ID ||
                ""
            ).trim() === TEST_BOUNDARY_CEMETERY_ID;

        if (map.getLayer("cemetery-boundary-fill")) {
            map.setLayoutProperty(
                "cemetery-boundary-fill",
                "visibility",
                visible ? "visible" : "none"
            );
        }

        if (map.getLayer("cemetery-boundary-outline")) {
            map.setLayoutProperty(
                "cemetery-boundary-outline",
                "visibility",
                visible ? "visible" : "none"
            );
        }

    }


    function getTestBoundaryBounds() {

        if (!testBoundaryData) {
            return null;
        }

        const bounds =
            new maplibregl.LngLatBounds();

        function extendCoordinates(coords) {

            if (!Array.isArray(coords)) {
                return;
            }

            if (
                coords.length >= 2 &&
                typeof coords[0] === "number" &&
                typeof coords[1] === "number"
            ) {
                bounds.extend(coords);
                return;
            }

            coords.forEach(extendCoordinates);

        }

        (testBoundaryData.features || []).forEach(
            function (feature) {

                if (
                    feature.properties &&
                    String(feature.properties.CEMETERY_ID || "").trim() === "TEST001"
                ) {
                    extendCoordinates(
                        feature.geometry &&
                        feature.geometry.coordinates
                    );
                }

            }
        );

        return bounds.isEmpty() ? null : bounds;

    }


    // ========================================================
    // INDIVIDUAL GRAVES
    // ========================================================

    function updateCemeteryGraves() {

        if (!map.getSource("graves-data")) {
            return;
        }

        if (!selectedCemeteryFeature) {

            map.getSource("graves-data").setData({
                type: "FeatureCollection",
                features: []
            });

            if (map.getLayer("graves-layer")) {
                map.setLayoutProperty(
                    "graves-layer",
                    "visibility",
                    "none"
                );
            }

            return;
        }

        const cemeteryID =
            String(
                selectedCemeteryFeature.properties.Cemetery_ID ||
                ""
            ).trim();

        const data =
            intermentsByCemetery[cemeteryID] ||
            { graves: [] };

        const features =
            (data.graves || []).map(
                function (grave, index) {

                    return {
                        type: "Feature",
                        properties: {
                            Cemetery_ID: cemeteryID,
                            Grave_Index: index + 1,
                            Person_Name: grave.name,
                            Veteran: grave.veteran,
                            Birth: grave.birth || "",
                            Death: grave.death || "",
                            Row: grave.row || "",
                            Plot: grave.plot || "",
                            Stone_Info: grave.stoneInfo || "",
                            Vet_Details: grave.vetDetails || "",
                            Marker_ID: grave.markerID || "",
                            Person_Data: JSON.stringify([grave])
                        },
                        geometry: {
                            type: "Point",
                            coordinates: grave.coordinates
                        }
                    };

                }
            );

        map.getSource("graves-data").setData({
            type: "FeatureCollection",
            features: features
        });

        if (map.getLayer("graves-layer")) {
            map.setLayoutProperty(
                "graves-layer",
                "visibility",
                "visible"
            );
        }

    }


    function fitSelectedCemetery() {

        if (!selectedCemeteryFeature) {
            return;
        }

        const cemeteryID =
            String(
                selectedCemeteryFeature.properties.Cemetery_ID ||
                ""
            ).trim();

        const bounds =
            cemeteryID === TEST_BOUNDARY_CEMETERY_ID
                ? getTestBoundaryBounds()
                : null;

        const intermentData =
            intermentsByCemetery[cemeteryID] ||
            {};

        const graveCoordinates =
            intermentData.coordinates || [];

        if (bounds) {

            graveCoordinates.forEach(
                function (coordinate) {
                    bounds.extend(coordinate);
                }
            );

            map.fitBounds(
                bounds,
                {
                    padding: 30,
                    maxZoom: 50,
                    duration: 1000
                }
            );

            return;
        }

        const fallback =
            new maplibregl.LngLatBounds(
                selectedCemeteryFeature.geometry.coordinates,
                selectedCemeteryFeature.geometry.coordinates
            );

        graveCoordinates.forEach(
            function (coordinate) {
                fallback.extend(coordinate);
            }
        );

        map.fitBounds(
            fallback,
            {
                padding: 30,
                maxZoom: 50,
                duration: 1000
            }
        );

    }


    function enterCemeteryMode(feature) {

        selectedCemeteryFeature = feature;

        infoPanel.style.display = "block";

        updateCemeteryBoundary();
        updateCemeteryGraves();
        fitSelectedCemetery();

    function exitCemeteryMode() {

        selectedCemeteryFeature = null;

        removeHoverLabel();

        updateCemeteryBoundary();
        updateCemeteryGraves();

        infoPanel.style.display = "block";

        map.flyTo({

            ],
            zoom: 11,
            duration: 800
        });

    }


    // ========================================================
    // GRAVE CLICK HANDLER
    // ========================================================

    function handleGraveClick(event) {

    if (
        !event.features ||
        !event.features.length
    ) {
        return;
    }

    const props =
        event.features[0].properties;

    infoPanel.style.display = "block";

    const cemetery =
        cemeteryFeatures.find(
            function (feature) {

                return String(
                    feature.properties.Cemetery_ID || ""
                ).trim() === String(
                    props.Cemetery_ID || ""
                ).trim();

            }
        );

    /*
     * The shared-marker system can pass the complete
     * person record through Person_Data.
     *
     * Normal individual graves also use this same
     * structure when available.
     */

    let person = null;

    if (props.Person_Data) {

        try {

            const parsed =
                JSON.parse(
                    props.Person_Data
                );

            if (
                Array.isArray(parsed) &&
                parsed.length
            ) {
                person = parsed[0];
            }

        }
        catch (error) {

            console.error(
                "Unable to parse Person_Data:",
                error
            );

        }

    }

    /*
     * Fallback for an ordinary grave feature.
     */

    if (!person) {

    const cemeteryName =

            : props.Cemetery_ID;


    let html = "";

    if (person.markerID) {

            </p>
        `;

    infoContent.innerHTML = html;


    if (event.originalEvent) {

        event.originalEvent.stopPropagation();

    }

}

    // ========================================================
    // SEARCH / FILTER PROCESSOR
    // ========================================================

    function processMapFilters() {


        // ====================================================
        // READ SEARCH
        // ====================================================

        const searchStr =
            searchBox.value
                .toLowerCase()
                .trim();


        const filterYear =
            parseInt(
                yearSlider.value,
                10
            );


        const searchIsActive =
            searchStr !== "" ||
            veteransOnly;


        // ====================================================
        // CLEAR BUTTON
        // ====================================================

        clearSearch.style.display =
            searchBox.value !== ""
                ? "block"
                : "none";


        // ====================================================
        // YEAR DISPLAY
        // ====================================================

        if (
            filterYear < 1900
        ) {

            yearVal.innerText =
                filterYear;

        }

        else {

            yearVal.innerText =
                "All";

        }


        // ====================================================
        // CALCULATE SEARCH MATCHES
        // ====================================================

        cemeteryFeatures.forEach(
            function (feature) {


                const props =
                    feature.properties;


                const cemeteryID =
                    String(
                        props.Cemetery_ID || ""
                    ).trim();


                const cemeteryText =
                    (
                        String(
                            props.Cemetery_Name ||
                            ""
                        ) +
                        " " +
                        String(
                            props.Other_Names ||
                            ""
                        )
                    )
                        .toLowerCase();


                const intermentData =
                    intermentsByCemetery[
                        cemeteryID
                    ] || {

                        people: [],

                        veteran: false

                    };


                const personText =
                    intermentData.people
                        .join(" ")
                        .toLowerCase();


                // ==========================================
                // TEXT MATCH
                // ==========================================

                let textMatch =
                    searchStr === "";


                if (
                    searchStr !== ""
                ) {

                    textMatch =
                        false;


                    if (
                        searchCemetery &&
                        cemeteryText.includes(
                            searchStr
                        )
                    ) {

                        textMatch =
                            true;

                    }


                    if (
                        searchPerson &&
                        personText.includes(
                            searchStr
                        )
                    ) {

                        textMatch =
                            true;

                    }

                }


                // ==========================================
                // VETERAN MATCH
                //
                // Either:
                // cemlist.csv VETS = 1
                //
                // OR:
                // interments.csv VETERAN = 1
                // ==========================================

                const hasVeteran =
                    Number(props.Vets) === 1 ||
                    intermentData.veteran;


                const veteranMatch =
                    !veteransOnly ||
                    hasVeteran;


                // ==========================================
                // FINAL SEARCH MATCH
                // ==========================================

                const finalMatch =
                    textMatch &&
                    veteranMatch;


                props.Search_Match =
                    finalMatch;


                props.Search_Active =
                    searchIsActive;

            }
        );


        // ====================================================
        // UPDATE MAP SOURCE
        // ====================================================

        const source =
            map.getSource(
                "cemeteries-data"
            );


        if (source) {

            source.setData({

                type:
                    "FeatureCollection",

                features:
                    cemeteryFeatures

            });

        }


        // ====================================================
        // BUILD MAP FILTER
        // ====================================================

        const activeFilters = [
            "all"
        ];


        // ====================================================
        // YEAR FILTER
        // ====================================================

        if (
            filterYear < 1900
        ) {

            activeFilters.push([

                "all",

                [
                    ">",
                    [
                        "get",
                        "Established_Year"
                    ],
                    0
                ],

                [
                    "<=",
                    [
                        "get",
                        "Established_Year"
                    ],
                    filterYear
                ]

            ]);

        }


        // ====================================================
        // SEARCH FILTER
        // ====================================================

        if (
            searchIsActive
        ) {

            activeFilters.push([

                "==",

                [
                    "get",
                    "Search_Match"
                ],

                true

            ]);

        }


        // ====================================================
        // APPLY MAIN CEMETERY FILTER
        // ====================================================

        if (
            activeFilters.length > 1
        ) {

            map.setFilter(

                "cemeteries-layer",

                activeFilters

            );

        }

        else {

            map.setFilter(

                "cemeteries-layer",

                null

            );

        }


        // ====================================================
        // APPLY HIGHLIGHT FILTER
        // ====================================================

        if (
            searchIsActive
        ) {

            map.setFilter(

                "cemeteries-highlight-layer",

                [

                    "all",

                    [
                        "==",

                        [
                            "get",
                            "Search_Active"
                        ],

                        true

                    ],

                    [
                        "==",

                        [
                            "get",
                            "Search_Match"
                        ],

                        true

                    ]

                ]

            );

        }

        else {

            map.setFilter(

                "cemeteries-highlight-layer",

                [

                    "==",

                    [
                        "get",
                        "Search_Active"
                    ],

                    true

                ]

            );

        }

    }

    map.on("click", function (event) {

        if (!selectedCemeteryFeature) {
            return;
        }

        const layers = [
    "cemeteries-layer",
    "cemeteries-highlight-layer",
    "graves-layer",
    "shared-markers-outer-layer",
    "shared-markers-inner-layer",
    "lake-cemeteries-layer"
].filter(function (id) {

});

        if (layers.length) {

                event.point,
                { layers: layers }
            );

            if (hits.length) {
                return;
            }
        }

        exitCemeteryMode();

    });

            if (
                map.getLayer(
                    "shared-markers-outer-layer"
                )
            ) {

                map.setLayoutProperty(
                    "shared-markers-outer-layer",
                    "visibility",
                    "none"
                );

            }


            if (
                map.getLayer(
                    "shared-markers-inner-layer"
                )
            ) {

                map.setLayoutProperty(
                    "shared-markers-inner-layer",
                    "visibility",
                    "none"
                );

            }


            return;

        }


        const cemeteryID =
            String(
                selectedCemeteryFeature
                    .properties
                    .Cemetery_ID ||
                ""
            ).trim();


        const groups =
            sharedMarkerState
                .groupsByCemetery[
                    cemeteryID
                ] || {};


        const features = [];


        Object.keys(groups).forEach(
            function (markerID) {

                const group =
                    groups[markerID];


                if (
                    !group ||
                    group.length < 2
                ) {

                    return;

                }


                // First valid GPS location
                // becomes the physical marker location.

                const representative =
                    group.find(
                        function (person) {

                            return Array.isArray(
                                person.coordinates
                            );

                        }
                    );


                if (!representative) {

                    return;

                }


                features.push({

                    type:
                        "Feature",

                    properties: {

                        Cemetery_ID:
                            cemeteryID,

                        Marker_ID:
                            markerID,

                        Person_Count:
                            group.length

                    },

                    geometry: {

                        type:
                            "Point",

                        coordinates:
                            representative.coordinates

                    }

                });

            }
        );


        source.setData({

            type:
                "FeatureCollection",

            features:
                features

        });


        map.setLayoutProperty(
            "shared-markers-outer-layer",
            "visibility",
            "visible"
        );


        map.setLayoutProperty(
            "shared-markers-inner-layer",
            "visibility",
            "visible"
        );

    }


    // ========================================================
    // REPLACE THE EXISTING GRAVE UPDATE FUNCTION
    //
    // Before MARKER_ID data loads, the original behavior is
    // retained. Once it loads, shared people disappear from
    // the individual layer and are represented by ◎.
    // ========================================================

    const originalUpdateCemeteryGraves =
        updateCemeteryGraves;


    updateCemeteryGraves =
        function () {

            if (
                !sharedMarkerState.loaded
            ) {

                originalUpdateCemeteryGraves();

                return;

            }


            const source =
                map.getSource(
                    "graves-data"
                );


            if (!source) {

                return;

            }


            if (!selectedCemeteryFeature) {

                source.setData({

                    type:
                        "FeatureCollection",

                    features:
                        []

                });


                if (
                    map.getLayer(
                        "graves-layer"
                    )
                ) {

                    map.setLayoutProperty(
                        "graves-layer",
                        "visibility",
                        "none"
                    );

                }


                updateSharedMarkerLayers();

                return;

            }


            const cemeteryID =
                String(
                    selectedCemeteryFeature
                        .properties
                        .Cemetery_ID ||
                    ""
                ).trim();


            const rows =
                sharedMarkerState
                    .rowsByCemetery[
                        cemeteryID
                    ] || [];


            const groups =
                sharedMarkerState
                    .groupsByCemetery[
                        cemeteryID
                    ] || {};


            const individualFeatures = [];


            rows.forEach(
                function (person, index) {

                    const markerID =
                        person.markerID;


                    const group =
                        markerID
                            ? groups[
                                markerID
                            ]
                            : null;


                    // 2+ people sharing the same
                    // MARKER_ID become ONE ◎ marker.

                    if (
                        markerID &&
                        group &&
                        group.length >= 2
                    ) {

                        return;

                    }


                    if (
                        !Array.isArray(
                            person.coordinates
                        )
                    ) {

                        return;

                    }


                    // Blank MARKER_ID or a
                    // single-use MARKER_ID
                    // remains a normal ●.

                    individualFeatures.push({

                        type:
                            "Feature",

                        properties: {

    Cemetery_ID:
        cemeteryID,

    Grave_Index:
        index + 1,

    Person_Name:
        person.name ||
        "Unnamed Interment",

    Veteran:
        person.veteran,

    Birth:
        person.birth || "",

    Death:
        person.death || "",

    Row:
        person.row || "",

    Plot:
        person.plot || "",

    Stone_Info:
        person.stoneInfo || "",

    Vet_Details:
        person.vetDetails || "",

    Marker_ID:
        person.markerID || "",

    Person_Data:
        JSON.stringify([
            person
        ])

},
                        geometry: {

                            type:
                                "Point",

                            coordinates:
                                person.coordinates

                        }

                    });

                }
            );


            source.setData({

                type:
                    "FeatureCollection",

                features:
                    individualFeatures

            });


            map.setLayoutProperty(
                "graves-layer",
                "visibility",
                "visible"
            );


            updateSharedMarkerLayers();

        };


    // ========================================================
    // PEOPLE BUTTONS / VIEW ALL
    //
    // These are added alongside the existing SEE MORE
    // event delegation. Existing cemetery buttons continue
    // to work normally.
    // ========================================================

    infoContent.addEventListener(
        "click",
        function (event) {

            // -----------------------------------------------
            // INDIVIDUAL PERSON
            // -----------------------------------------------

            const personButton =
                event.target.closest(
                    ".shared-marker-person-button"
                );


            if (personButton) {

                const cemeteryID =
                    decodeURIComponent(
                        personButton
                            .dataset
                            .sharedCemetery
                    );

                const markerID =
                    decodeURIComponent(
                        personButton
                            .dataset
                            .sharedMarker
                    );

                const index =
                    parseInt(
                        personButton
                            .dataset
                            .sharedIndex,
                        10
                    );

                const groups =
                    sharedMarkerState
                        .groupsByCemetery[
                            cemeteryID
                        ];

                const group =
                    groups &&
                    groups[markerID];

                const person =
                    group &&
                    group[index];

                if (person) {

                    handleGraveClick({

                        features: [
                            {
                                properties: {
                                    Cemetery_ID:
                                        cemeteryID,
                                    Person_Data:
                                        JSON.stringify([
                                            person
                                        ])
                                }
                            }
                        ],

                        originalEvent: event

                    });

                }

                return;

            }


            // -----------------------------------------------
            // VIEW ALL
            // -----------------------------------------------

            const viewAllButton =
                event.target.closest(
                    ".shared-marker-view-all-button"
                );

            if (viewAllButton) {

                showSharedMarkerPanel(

                    decodeURIComponent(
                        viewAllButton
                            .dataset
                            .sharedCemetery
                    ),

                    decodeURIComponent(
                        viewAllButton
                            .dataset
                            .sharedMarker
                    ),

                    true

                );

                return;

            }

        }
    );

    // ========================================================
    // CREATE SHARED MARKER LAYERS
    // ========================================================

    map.on(
        "load",
        function () {


            // -----------------------------------------------
            // DATA SOURCE
            // -----------------------------------------------

            if (
                !map.getSource(
                    "shared-markers-data"
                )
            ) {

                map.addSource(
                    "shared-markers-data",
                    {

                        type:
                            "geojson",

                        data: {

                            type:
                                "FeatureCollection",

                            features:
                                []

                        }

                    }
                );

            }


            // -----------------------------------------------
            // OUTER RING
            // -----------------------------------------------

            if (
                !map.getLayer(
                    "shared-markers-outer-layer"
                )
            ) {

                map.addLayer({

                    id:
                        "shared-markers-outer-layer",

                    type:
                        "circle",

                    source:
                        "shared-markers-data",

                    layout: {

                        visibility:
                            "none"

                    },

                    paint: {

                        "circle-radius":
                            8,

                        "circle-color":
                            "#ffffff",

                        "circle-opacity":
                            0,

                        "circle-stroke-width":
                            2,

                        "circle-stroke-color":
                            "#463a2d",

                        "circle-stroke-opacity":
                            0.95

                    }

                });

            }


            // -----------------------------------------------
            // INNER DOT
            // -----------------------------------------------

            if (
                !map.getLayer(
                    "shared-markers-inner-layer"
                )
            ) {

                map.addLayer({

                    id:
                        "shared-markers-inner-layer",

                    type:
                        "circle",

                    source:
                        "shared-markers-data",

                    layout: {

                        visibility:
                            "none"

                    },

                    paint: {

                        "circle-radius":
                            4,

                        "circle-color":
                            "#463a2d",

                        "circle-opacity":
                            0.92,

                        "circle-stroke-width":
                            1.5,

                        "circle-stroke-color":
                            "#ffffff"

                    }

                });

            }


            // -----------------------------------------------
            // CLICK
            //
            // The OUTER layer is the click target, so the
            // physical target is larger than the visible dot.
            // -----------------------------------------------

            map.on(
                "click",
                "shared-markers-outer-layer",
                handleSharedMarkerClick
            );


            // -----------------------------------------------
            // HOVER
            // -----------------------------------------------

            map.on(
                "mouseenter",
                "shared-markers-outer-layer",
                function (event) {

                    if (
                        !desktopHoverEnabled()
                    ) {

                        return;

                    }


                    map.getCanvas()
                        .style.cursor =
                        "pointer";


                    const feature =
                        event.features &&
                        event.features[0];


                    if (feature) {

                        showHoverLabel(

                            "Marker for " +
                            feature.properties
                                .Person_Count +
                            " people",

                            event.lngLat

                        );

                    }

                }
            );


            map.on(
                "mousemove",
                "shared-markers-outer-layer",
                function (event) {

                    if (
                        !desktopHoverEnabled()
                    ) {

                        return;

                    }


                    const feature =
                        event.features &&
                        event.features[0];


                    if (feature) {

                        showHoverLabel(

                            "Marker for " +
                            feature.properties
                                .Person_Count +
                            " people",

                            event.lngLat

                        );

                    }

                }
            );


            map.on(
                "mouseleave",
                "shared-markers-outer-layer",
                function () {

                    map.getCanvas()
                        .style.cursor =
                        "";

                    removeHoverLabel();

                }
            );


            // =================================================
            // LOAD INTERMENTS AGAIN FOR MARKER_ID SUPPORT
            //
            // The existing loader remains untouched.
            // This second read only adds the grouping information
            // needed for physical markers.
            // =================================================

            Papa.parse(

                new URL(
                    "interments.csv",
                    document.baseURI
                ).href,

                {

                    download:
                        true,

                    header:
                        true,

                    skipEmptyLines:
                        true,


                    complete:
                        function (results) {


                            sharedMarkerState
                                .rowsByCemetery =
                                {};

                            sharedMarkerState
                                .groupsByCemetery =
                                {};


                            results.data.forEach(
                                function (row) {

                                    const cemeteryID =
                                        String(
                                            row.CEMETERY_ID ||
                                            ""
                                        ).trim();


                                    if (
                                        !cemeteryID
                                    ) {

                                        return;

                                    }


                                    if (
                                        !sharedMarkerState
                                            .rowsByCemetery[
                                                cemeteryID
                                            ]
                                    ) {

                                        sharedMarkerState
                                            .rowsByCemetery[
                                                cemeteryID
                                            ] = [];

                                    }


                                    if (
                                        !sharedMarkerState
                                            .groupsByCemetery[
                                                cemeteryID
                                            ]
                                    ) {

                                        sharedMarkerState
                                            .groupsByCemetery[
                                                cemeteryID
                                            ] = {};

                                    }


                                    const firstName =
                                        String(
                                            row[
                                                "FIRST NAME"
                                            ] || ""
                                        ).trim();


                                    const lastName =
                                        String(
                                            row[
                                                "LAST NAME"
                                            ] || ""
                                        ).trim();


                                    const fullName =
                                        (
                                            firstName +
                                            " " +
                                            lastName
                                        ).trim();


                                    const markerID =
                                        String(
                                            row.MARKER_ID ||
                                            ""
                                        ).trim();


                                    const lat =
                                        parseFloat(
                                            row.LAT
                                        );


                                    const lon =
                                        parseFloat(
                                            row.LONG
                                        );


                                    const person = {

                                        name:
                                            fullName ||
                                            "Unnamed Interment",

                                        firstName:
                                            firstName,

                                        lastName:
                                            lastName,

                                        birth:
                                            String(
                                                row.BIRTH ||
                                                ""
                                            ).trim(),

                                        death:
                                            String(
                                                row.DEATH ||
                                                ""
                                            ).trim(),

                                        row:
                                            String(
                                                row.ROW ||
                                                ""
                                            ).trim(),

                                        plot:
                                            String(
                                                row.PLOT ||
                                                ""
                                            ).trim(),

                                        stoneInfo:
                                            String(
                                                row[
                                                    "ADDITIONAL INFORMATION ON STONE"
                                                ] ||
                                                ""
                                            ).trim(),

                                        veteran:
                                            String(
                                                row.VETERAN ||
                                                ""
                                            ).trim() === "1",

                                        vetDetails:
                                            String(
                                                row[
                                                    "VET DETAILS"
                                                ] ||
                                                ""
                                            ).trim(),

                                        markerID:
                                            markerID,

                                        coordinates:
                                            !isNaN(lat) &&
                                            !isNaN(lon)

                                                ? [
                                                    lon,
                                                    lat
                                                ]

                                                : null

                                    };


                                    sharedMarkerState
                                        .rowsByCemetery[
                                            cemeteryID
                                        ]
                                        .push(
                                            person
                                        );


                                    // Only nonblank MARKER_ID
                                    // values enter a group.

                                    if (
                                        markerID
                                    ) {

                                        if (
                                            !sharedMarkerState
                                                .groupsByCemetery[
                                                    cemeteryID
                                                ][markerID]
                                        ) {

                                            sharedMarkerState
                                                .groupsByCemetery[
                                                    cemeteryID
                                                ][markerID] =
                                                [];

                                        }


                                        sharedMarkerState
                                            .groupsByCemetery[
                                                cemeteryID
                                            ][markerID]
                                            .push(
                                                person
                                            );

                                    }

                                }
                            );


                            sharedMarkerState
                                .loaded =
                                true;


                            // Refresh the current cemetery,
                            // if one is already selected.

                            updateCemeteryGraves();

                        },


                    error:
                        function (error) {

                            console.error(
                                "MARKER_ID support loading error:",
                                error
                            );

                        }

                }

            );

        }

    );

})();

</script>

</html>
